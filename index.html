  /* موضع أفقي آمن: نقطة واحدة تتوسط الرسم بدل القسمة على صفر */
  function xt(i, len) { return len <= 1 ? 0.5 : i / (len - 1); }
  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) {
      if (v <= m * p) return m * p;
    }
    return 10 * p;
  }

  const defs = `
    <defs>
      <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#C9A96A" stop-opacity=".95"/>
        <stop offset="100%" stop-color="#8A6B33" stop-opacity=".75"/>
      </linearGradient>
      <linearGradient id="gNavy" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2E4A7A" stop-opacity=".9"/>
        <stop offset="100%" stop-color="#12233F" stop-opacity=".85"/>
      </linearGradient>
      <linearGradient id="gEmerald" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4FA98B" stop-opacity=".9"/>
        <stop offset="100%" stop-color="#2C6B57" stop-opacity=".8"/>
      </linearGradient>
      <linearGradient id="gBurgundy" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#C0535E" stop-opacity=".9"/>
        <stop offset="100%" stop-color="#7A2F38" stop-opacity=".85"/>
      </linearGradient>
      <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#C9A96A" stop-opacity=".18"/>
        <stop offset="100%" stop-color="#C9A96A" stop-opacity="0"/>
      </linearGradient>
    </defs>`;

  function frame(w, h, labels, yTicks, opts) {
    opts = opts || {};
    const L = opts.left || 66, R = opts.right || 14, T = opts.top || 36, B = opts.bottom || 36;
    const XIN = opts.xInset || 0;
    let s = defs;
    /* خطوط شبكة أفقية + تسميات */
    for (const tk of yTicks) {
      const y = tk.y;
      s += el("line", { x1: L, y1: y, x2: w - R, y2: y, stroke: C.line, "stroke-width": 1 });
      s += el("text", { x: L - 8, y: y + 4, "text-anchor": "end", "font-size": 12, fill: MUT, "font-family": "Cairo" }, tk.label);
    }
    /* تسميات المحور الأفقي */
    const xPos = v => L + XIN + (w - L - R - XIN) * v;
    labels.forEach((lb, i) => {
      const x = labels.length === 1 ? (L + (w - L - R) / 2) : xPos(i / (labels.length - 1));
      s += el("text", { x, y: h - 8, "text-anchor": "middle", "font-size": 12.5, fill: TCOL, "font-family": "Cairo", "font-weight": 700 }, lb);
    });
    /* محاور */
    s += el("line", { x1: L, y1: T, x2: L, y2: h - B, stroke: C.line });
    s += el("line", { x1: L, y1: h - B, x2: w - R, y2: h - B, stroke: C.line });
    return { svg: s, L, R, T, B, xPos };
  }

  /* ---------- خطوط (Line) مع مساحة ---------- */
  function lineChart(opts) {
    const w = opts.width || 760, h = opts.height || 300;
    const labels = opts.labels;
    const series = opts.series.map(sr => ({
      name: sr.name, color: sr.color, dash: sr.dash || null,
      data: sr.data.map(v => (v === null ? null : v))
    }));
    let max = 0, min = 0;
    series.forEach(sr => sr.data.forEach(v => {
      if (v !== null) { if (v > max) max = v; if (v < min) min = v; }
    }));
    if (max === 0 && min === 0) max = 1;
    /* بيانات سالبة بالكامل (بدون حدود صريحة): مقياس سالب كامل يملأ الرسم */
    const allNeg = opts.yMin === undefined && opts.yMax === undefined && max === 0 && min < 0;
    if (opts.yMin !== undefined) min = opts.yMin;
    if (opts.yMax !== undefined) max = opts.yMax;
    let nMax, nMin;
    if (allNeg) {
      nMax = 0;
      nMin = -niceMax(Math.abs(min) * 1.08);
    } else {
      nMax = niceMax(Math.max(Math.abs(max), Math.abs(min)) * 1.08);
      nMin = min < 0 ? -nMax : 0;
    }
    const T0 = 36, B0 = 36;
    const yTicks = [];
    for (let i = 0; i <= 4; i++) {
      const v = nMin + (nMax - nMin) * i / 4;
      yTicks.push({ y: T0 + (h - T0 - B0) * (1 - (v - nMin) / (nMax - nMin)), v, label: opts.yFmt ? opts.yFmt(v) : E.fmt(v) });
    }
    const fr = frame(w, h, labels, yTicks, {});
    const yPos = scale([0, 1], nMax, nMin, fr.T, h - fr.B);
    let svg = fr.svg;
    /* تمريرة أولى: جمع مواضع النقاط */
    const allPts = series.map(sr => sr.data.map((v, i) => {
      if (v === null) return null;
      return { v, i, x: fr.xPos(xt(i, sr.data.length)), y: yPos(v) };
    }));
    series.forEach((sr, si) => {
      let path = "", area = "", first = true, hasNull = false;
      sr.data.forEach((v, i) => {
        if (v === null) { hasNull = true; return; }
        const x = fr.xPos(xt(i, sr.data.length)), y = yPos(v);
        path += (first ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
        if (first) area = `M${x.toFixed(1)} ${(h - fr.B).toFixed(1)} L${x.toFixed(1)} ${y.toFixed(1)} `;
        else area += `L${x.toFixed(1)} ${y.toFixed(1)} `;
        first = false;
      });
      area += `L${fr.xPos(xt(sr.data.length - 1, sr.data.length)).toFixed(1)} ${(h - fr.B).toFixed(1)} Z`;
      if (sr.area !== false && !hasNull) {
        svg += el("path", { d: area, fill: "url(#gArea)", stroke: "none" });
      }
      svg += el("path", { d: path.trim(), fill: "none", stroke: sr.color, "stroke-width": 2.4, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": sr.dash || "" });
      const pts = allPts[si];
      pts.forEach((p, idx) => {
        if (!p) return;
        const { v, i, x, y } = p;
        svg += el("circle", { cx: x, cy: y, r: 4, fill: "var(--panel)", stroke: sr.color, "stroke-width": 2.2 });
        svg += el("title", {}, `${sr.name} · ${labels[i]} · ${opts.yFmt ? opts.yFmt(v) : E.fmt(v)}`);
      });
    });
    /* تمريرة ثانية: تسميات مفصولة رأسياً دائماً وبلا تلامس مع النقاط
       - سلسلتان: تسمية السلسلة الأعلى فوقها بمسافة، وتسمية الأدنى تحتها بمسافة
       - ثلاث سلاسل فأكثر: ترتيب تسميات الشهر رأسياً حسب ارتفاع نقاطها */
    if (opts.valueLabels) {
      series.forEach((sr, si) => {
        allPts[si].forEach((p, idx) => {
          if (!p) return;
          const { v, i, x, y } = p;
          let labelY = y;
          if (series.length === 2) {
            const other = allPts[1 - si][idx];
            if (other && other.y !== undefined) {
              const topY = Math.min(y, other.y), botY = Math.max(y, other.y);
              if (y === topY) {
                labelY = topY - 14;
              } else {
                labelY = botY + 22;
              }
            } else {
              labelY = y - 14;
            }
          } else if (series.length > 2) {
            /* ثلاث سلاسل أو أكثر: كل تسميات الشهر تترص فوق أعلى نقطة في المجموعة
               (بعيداً عن كل الدوائر) — بترتيب ارتفاع النقاط من الأعلى للأسفل،
               وعند الاقتراب من حافة الرسم تتحرك المجموعة كلها ككتلة واحدة */
            const group = [];
            for (let s2 = 0; s2 < series.length; s2++) {
              const p2 = allPts[s2][idx];
              if (p2) group.push({ si: s2, y: p2.y });
            }
            group.sort((a, b) => a.y - b.y);
            const myPos = group.findIndex(g => g.si === si);
            const k = group.length;
            /* الوضع الطبيعي: كل التسميات فوق أعلى نقطة في المجموعة.
               لو المجموعة قريبة جداً من حافة الرسم العلوية:
               تتحول التسميات كلها تحت أدنى نقطة (بلا لمس أي دائرة). */
            const aboveBottom = group[0].y - 14 - (k - 1) * 20;
            if (aboveBottom < fr.T + 10) {
              const belowTop = group[k - 1].y + 22 + (k - 1) * 20;
              let extra = 0;
              if (belowTop > h - fr.B - 8) extra = (h - fr.B - 8) - belowTop;
              labelY = group[k - 1].y + 22 + myPos * 20 + extra;
            } else {
              labelY = group[0].y - 14 - myPos * 20;
            }
          } else {
            labelY = y - 14;
          }
          if (labelY < fr.T + 8) labelY = fr.T + 8;
          if (labelY > h - fr.B - 6) labelY = h - fr.B - 6;
          const isFirst = i === 0, isLast = i === allPts[si].length - 1;
          let labelX = x, anchor = "middle";
          if (isFirst) { labelX = x + 8; anchor = "start"; }
          else if (isLast) { labelX = x - 8; anchor = "end"; }
          svg += el("text", { x: labelX, y: labelY, "text-anchor": anchor, "font-size": 10.5, fill: sr.color, "font-family": "Cairo", "font-weight": 700 }, opts.yFmt ? opts.yFmt(v) : E.fmt(v));
        });
      });
    }
    return wrap(w, h, svg, opts.legend);
  }

  /* ---------- أعمدة ---------- */
  function colChart(opts) {
    const w = opts.width || 760, h = opts.height || 300;
    const labels = opts.labels;
    const series = opts.series;
    let max = 0, min = 0;
    series.forEach(sr => sr.data.forEach(v => {
      if (v !== null) { if (v > max) max = v; if (v < min) min = v; }
    }));
    if (opts.yMax !== undefined) max = opts.yMax;
    if (opts.yMin !== undefined) min = opts.yMin;
    const nMax = niceMax(Math.max(Math.abs(max), Math.abs(min)) * 1.06);
    const nMin = min < 0 ? -nMax : 0;
    const T0 = 36;
    const extraBottom = (opts.valueLabels && series.length > 1) ? (series.length - 1) * 19 + 12 : 0;
    const B0 = 34 + extraBottom;
    const yTicks = [];
    for (let i = 0; i <= 4; i++) {
      const v = nMin + (nMax - nMin) * i / 4;
      yTicks.push({ y: T0 + (h - T0 - B0) * (1 - (v - nMin) / (nMax - nMin)), v, label: opts.yFmt ? opts.yFmt(v) : E.fmt(v) });
    }
    /* أعمدة متعددة بأرقام: مساحة سفلية إضافية حتى لا تتداخل الأرقام مع أسماء الشهور */
    const fr = frame(w, h, labels, yTicks, { bottom: B0, xInset: 24 + series.length * 20 });
    const yPos = scale([0, 1], nMax, nMin, fr.T, h - fr.B);
    let svg = fr.svg;
    const n = labels.length, k = series.length;
    const slot = (w - fr.L - fr.R) / n;
    const bw = Math.min(46, slot * 0.6 / k);
    series.forEach((sr, si) => {
      sr.data.forEach((v, i) => {
        if (v === null) {
          svg += el("text", { x: fr.xPos(xt(i, n)), y: (h - fr.B) / 2 + fr.T, "text-anchor": "middle", "font-size": 9, fill: MUT, "font-family": "Cairo" }, "…");
          return;
        }
        const cx = fr.xPos(xt(i, n));
        const x = cx - (k * bw) / 2 + si * bw + bw * 0.06;
        const y0 = yPos(Math.max(0, nMin)), y1 = yPos(v);
        const yTop = Math.min(y0, y1), yH = Math.max(2, Math.abs(y1 - y0));
        const fill = opts.useSignColor ? (v < 0 ? "url(#gBurgundy)" : "url(#gEmerald)") : sr.fill;
        svg += el("rect", { x: x.toFixed(1), y: yTop.toFixed(1), width: (bw * 0.88).toFixed(1), height: yH.toFixed(1), rx: 4, fill, stroke: sr.stroke || "none", "stroke-width": 1 });
        svg += el("title", {}, `${sr.name} · ${labels[i]} · ${opts.yFmt ? opts.yFmt(v) : E.fmt(v)}`);
        if (opts.valueLabels) {
          if (k === 1) {
            /* سلسلة واحدة: الرقم فوق العمود (داخل منطقة الرسم) — بلا تلامس مع الأعمدة المجاورة */
            let ly = yTop - 8;
            if (ly < fr.T + 8) ly = fr.T + 8;
            if (ly > h - fr.B - 6) ly = h - fr.B - 6;
            svg += el("text", { x: cx, y: ly, "text-anchor": "middle", "font-size": 10.5, fill: "var(--muted)", "font-family": "Cairo", "font-weight": 700 }, opts.yFmt ? opts.yFmt(v) : E.fmt(v));
          } else {
            /* متعدد السلاسل: الرقم تحت العمود (فوق المحور) بشكل متدرج */
            svg += el("text", { x: cx + (si - (k - 1) / 2) * bw, y: y0 + 12 + si * 19, "text-anchor": "middle", "font-size": 9.5, fill: "var(--muted)", "font-family": "Cairo", "font-weight": 700 }, opts.yFmt ? opts.yFmt(v) : E.fmt(v));
          }
        }
      });
    });
    return wrap(w, h, svg, opts.legend);
  }

  /* ---------- أعمدة + خط (Combo) ----------
     الأعمدة قد تكون سالبة (قاعدة الإشارات: الربح الإجمالي بالسالب)
     → مقياس متماثل حول الصفر مثل colChart */
  function comboChart(opts) {
    const w = opts.width || 760, h = opts.height || 300;
    const labels = opts.labels;
    const col = opts.columns[0];
    const line = opts.line;
    let maxC = 0, minC = 0;
    col.data.forEach(v => {
      if (v !== null) { if (v > maxC) maxC = v; if (v < minC) minC = v; }
    });
    if (opts.yMaxC !== undefined) maxC = opts.yMaxC;
    if (opts.yMinC !== undefined) minC = opts.yMinC;
    const nMaxC = niceMax(Math.max(Math.abs(maxC), Math.abs(minC)) * 1.1);
    const nMinC = minC < 0 ? -nMaxC : 0;
    const T0 = 36, B0 = 36;
    const yTicksC = [0, 0.25, 0.5, 0.75, 1].map(t => {
      const v = nMinC + (nMaxC - nMinC) * t;
      return { y: T0 + (h - T0 - B0) * (1 - t), v, label: opts.yFmtC(v) };
    });
    const fr = frame(w, h, labels, yTicksC, { left: 70, xInset: 24 });
    const yC = scale([0, 1], nMaxC, nMinC, fr.T, h - fr.B);
    const nMaxL = opts.yMaxL || 100, nMinL = opts.yMinL !== undefined ? opts.yMinL : 0;
    const yL = scale([0, 1], nMaxL, nMinL, fr.T, h - fr.B);
    let svg = fr.svg;
    const n = labels.length;
    const slot = (w - fr.L - fr.R) / n;
    const bw = Math.min(46, slot * 0.55);
    col.data.forEach((v, i) => {
      if (v === null) return;
      const cx = fr.xPos(xt(i, n));
      const x = cx - bw / 2;
      const y0 = yC(Math.max(0, nMinC)), y1 = yC(v);
      const yTop = Math.min(y0, y1), yH = Math.max(2, Math.abs(y1 - y0));
      svg += el("rect", { x: x.toFixed(1), y: yTop.toFixed(1), width: bw.toFixed(1), height: yH.toFixed(1), rx: 4, fill: col.fill });
      svg += el("title", {}, `${col.name} · ${labels[i]} · ${opts.yFmtC(v)}`);
      if (opts.valueLabels) {
        const lastCol = i === n - 1;
        svg += el("text", { x: lastCol ? cx - bw / 2 - 7 : cx + bw / 2 + 7, y: yTop + 10, "text-anchor": lastCol ? "end" : "start", "font-size": 10.5, fill: "var(--muted)", "font-family": "Cairo", "font-weight": 700 }, opts.yFmtC(v));
      }
    });
    /* خط الهامش */
    let path = "";
    const pts = [];
    line.data.forEach((v, i) => {
      if (v === null) return;
      const x = fr.xPos(xt(i, line.data.length)), y = yL(v);
      path += (pts.length ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1) + " ";
      pts.push({ x, y, v, i });
    });
    svg += el("path", { d: path, fill: "none", stroke: line.color, "stroke-width": 2.4, "stroke-dasharray": line.dash || "", "stroke-linecap": "round" });
    pts.forEach(p => {
      svg += el("circle", { cx: p.x, cy: p.y, r: 3.2, fill: "var(--panel)", stroke: line.color, "stroke-width": 2 });
      /* تسمية الهامش فوق أعلى عنصر (العمود أو نقطة الخط) — بلا تلامس مع أي منهما */
      const colV = col.data[p.i];
      const colTop = (colV !== null && colV !== undefined) ? Math.min(yC(Math.max(0, nMinC)), yC(colV)) : fr.T;
      const labelY = Math.max(fr.T + 8, Math.min(colTop, p.y) - 15);
      if (opts.lineLabels !== false) svg += el("text", { x: p.x, y: labelY, "text-anchor": "middle", "font-size": 10.5, fill: line.color, "font-family": "Cairo", "font-weight": 700 }, opts.yFmtL(p.v));
    });
    return wrap(w, h, svg, opts.legend);
  }

  /* ---------- أشرطة أفقية ---------- */
  function hbarChart(opts) {
    const items = opts.items;
    const w = opts.width || 760, hh = opts.rowH || 38;
    const h = items.length * hh + 18;
    const L = opts.left || 155, R = 150;
    const max = Math.max(...items.map(i => i.value)) || 1;
    let svg = defs;
    items.forEach((it, i) => {
      const y = 10 + i * hh;
      const bw2 = (w - L - R) * (it.value / max);
      svg += el("text", { x: L - 10, y: y + hh / 2 + 5, "text-anchor": "end", "font-size": 13, fill: TCOL, "font-family": "Cairo", "font-weight": 700 }, it.label);
      svg += el("rect", { x: L, y, width: Math.max(2, bw2), height: hh - 12, rx: 5, fill: it.color || "url(#gGold)" });
      svg += el("title", {}, `${it.label} · ${opts.fmt(it.value)}${it.pct !== undefined ? " · " + E.fmtPct(it.pct) : ""}`);
      svg += el("text", { x: L + Math.max(2, bw2) + 10, y: y + hh / 2 + 5, "font-size": 13, fill: TCOL, "font-family": "Cairo", "font-weight": 800 }, opts.fmt(it.value) + (it.pct !== undefined ? ` · ${E.fmtPct(it.pct)}` : ""));
    });
    return wrap(w, h, svg);
  }

  /* ---------- دونات ---------- */
  function donutChart(opts) {
    const size = opts.size || 240, cx = size / 2, cy = size / 2, r = size / 2 - 14, ir = r * 0.62;
    const total = opts.segments.reduce((s, g) => s + g.value, 0) || 1;
    let angle = -Math.PI / 2;
    let svg = defs;
    opts.segments.forEach(seg => {
      const frac = seg.value / total;
      const a2 = angle + frac * Math.PI * 2;
      const large = frac > 0.5 ? 1 : 0;
      const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
      const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
      const x3 = cx + ir * Math.cos(a2), y3 = cy + ir * Math.sin(a2);
      const x4 = cx + ir * Math.cos(angle), y4 = cy + ir * Math.sin(angle);
      const d = `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${x3.toFixed(1)} ${y3.toFixed(1)} A${ir} ${ir} 0 ${large} 0 ${x4.toFixed(1)} ${y4.toFixed(1)} Z`;
      svg += el("path", { d, fill: seg.color, "fill-opacity": seg.opacity || 1, stroke: "var(--panel)", "stroke-width": 2 });
      svg += el("title", {}, `${seg.label} · ${opts.fmt(seg.value)} · ${E.fmtPct(seg.value / total * 100)}`);
      angle = a2;
    });
    svg += el("text", { x: cx, y: cy - 22, "text-anchor": "middle", "font-size": 13, fill: MUT, "font-family": "Cairo" }, opts.centerLabel || "");
    svg += el("text", { x: cx, y: cy + 26, "text-anchor": "middle", "font-size": 24, fill: TCOL, "font-family": "Cairo", "font-weight": 800 }, opts.centerValue || "");
    return wrap(size, size, svg, opts.legend, "donut-box");
  }

  /* ---------- مراحل تكوّن النتيجة ---------- */
  function waterfallChart(opts) {
    const w = opts.width || 780, h = opts.height || 320;
    const steps = opts.steps;
    const L = 62, R = 16, T = 48, B = 48;
    let maxAbs = Math.max(...steps.map(s => Math.abs(s.value))) || 1;
    const nMax = niceMax(maxAbs * 1.1);
    /* zeroBased: مقياس من 0 إلى nMax (للجسور المتراكمة) بدل المقياس المتماثل ± */
    const yTicks = [0, 0.25, 0.5, 0.75, 1].map(t => ({ y: 0, v: nMax * t, label: opts.fmt(nMax * t) }));
    let svg = defs;
    for (const tk of yTicks) {
      const y = T + (h - T - B) * (1 - tk.v / nMax);
      svg += el("line", { x1: L, y1: y, x2: w - R, y2: y, stroke: C.line });
      svg += el("text", { x: L - 8, y: y - 4, "text-anchor": "end", "font-size": 11.5, fill: MUT, "font-family": "Cairo" }, tk.label);
    }
    /* خط الصفر */
    const y0 = opts.zeroBased ? (T + h - B) : T + (h - T - B) * (1 - Math.max(0, Math.min(1, (0 + nMax) / (2 * nMax))));
    svg += el("line", { x1: L, y1: y0.toFixed(1), x2: w - R, y2: y0.toFixed(1), stroke: C.muted, "stroke-opacity": .4, "stroke-dasharray": "4 4" });
    const n = steps.length;
    const slot = (w - L - R) / n;
    const bw = slot * 0.58;
    /* حساب مواضع الأعمدة (تراكمي) */
    const yAbs = opts.zeroBased
      ? v => T + (h - T - B) * (1 - Math.max(0, Math.min(1, v / nMax)))
      : v => T + (h - T - B) * (1 - (v + nMax) / (2 * nMax));
    let cum = 0, connectors = "";
    steps.forEach((st, i) => {
      const cx = L + slot * i + slot / 2;
      const x = cx - bw / 2;
      /* المجاميع الفرعية والنتيجة النهائية: أعمدة «موضع» من الصفر حتى القيمة
         التراكمية الحالية (لا تُضاف على التراكمي) — في الرسم القياسي.
         في وضع stackAll (الجسر): كل الأعمدة تتراكم عادةً. */
      const isPosMarker = !opts.stackAll && (st.kind === "subtotal" || st.kind === "total");
      const base = isPosMarker ? 0 : (opts.stackAll ? cum : (st.kind === "rev" ? 0 : cum));
      const top = isPosMarker ? cum : base + st.value;
      const yTop = yAbs(Math.max(base, top)), yBot = yAbs(Math.min(base, top));
      const fill = st.kind === "cost" ? "url(#gBurgundy)" : st.kind === "total" ? "url(#gGold)" : st.kind === "subtotal" ? "url(#gNavy)" : "url(#gEmerald)";
      svg += el("rect", { x: x.toFixed(1), y: yTop.toFixed(1), width: bw.toFixed(1), height: Math.max(2, yBot - yTop).toFixed(1), rx: 4, fill });
      svg += el("title", {}, `${st.label} · ${opts.fmt(st.value)}`);
      const barH = Math.abs(yBot - yTop);
      const labelW = String(opts.fmt(st.value)).length * 7.5;
      if (barH > 30 && labelW < bw - 8) {
        /* عمود طويل: الرقم داخل العمود بحدود واضحة */
        svg += el("text", { x: cx, y: yTop + 20, "text-anchor": "middle", "font-size": 11.5, fill: "#FFFFFF", stroke: "rgba(7,14,27,0.55)", "stroke-width": 3, "paint-order": "stroke", "font-family": "Cairo", "font-weight": 800 }, opts.fmt(st.value));
      } else {
        /* عمود قصير أو رقم عريض: فوق العمود بمسافة آمنة */
        svg += el("text", { x: cx, y: yTop - 10, "text-anchor": "middle", "font-size": 11.5, fill: "var(--text)", "font-family": "Cairo", "font-weight": 800 }, opts.fmt(st.value));
      }
      svg += el("text", { x: cx, y: h - 20, "text-anchor": "middle", "font-size": 10.5, fill: TCOL, "font-family": "Cairo", "font-weight": 700 }, st.label);
      /* وصلات */
      const prevX = cx - slot;
      const prevTop = cum;
      if (i > 0 && (opts.stackAll || st.kind !== "rev")) {
        const yPrev = yAbs(prevTop), yCur = yAbs(prevTop);
        connectors += el("line", { x1: prevX + bw / 2 + (slot - bw) / 2, y1: yPrev.toFixed(1), x2: x - 3, y2: yCur.toFixed(1), stroke: C.muted, "stroke-opacity": .5, "stroke-dasharray": "3 3" });
      }
      cum = top;
    });
    svg += connectors;
    return wrap(w, h, svg, opts.legend);
  }

  /* ---------- نقطة التعادل ---------- */
  function breakEvenChart(opts) {
    const w = opts.width || 760, h = opts.height || 340;
    const L = 78, R = 20, T = 26, B = 46;
    const PW = w - L - R, PH = h - T - B;
    const ok = v => typeof v === "number" && isFinite(v) && !Number.isNaN(v);

    /* المقياس: ديناميكي من البيانات — لا أرقام ثابتة */
    let maxX = ok(opts.maxX) && opts.maxX > 0 ? opts.maxX : 0;
    let maxY = ok(opts.maxY) && opts.maxY > 0 ? opts.maxY : 0;
    if (!maxX || !maxY) {
      const xs = [], ys = [];
      (opts.revenuePoints || []).concat(opts.costPoints || [], opts.fixedPoints || [])
        .forEach(pt => { if (ok(pt.x)) xs.push(pt.x); if (ok(pt.y)) ys.push(pt.y); });
      [opts.beX, opts.actualX].concat((opts.markers || []).map(m => m.x))
        .forEach(v => { if (ok(v)) xs.push(v); });
      maxX = maxX || niceMax(Math.max.apply(null, xs.concat([1])) * 1.12);
      maxY = maxY || niceMax(Math.max.apply(null, ys.concat([1])) * 1.12);
    }

    const yTicks = [0, 0.25, 0.5, 0.75, 1].map(t => maxY * t);
    let svg = defs;
    for (const v of yTicks) {
      const y = T + PH * (1 - v / maxY);
      svg += el("line", { x1: L, y1: y, x2: w - R, y2: y, stroke: C.line });
      svg += el("text", { x: L - 10, y: y + 4, "text-anchor": "end", "font-size": 11.5, fill: MUT, "font-family": "Cairo" }, opts.fmt(v));
    }
    /* علامات المحور السيني */
    for (let i = 0; i <= 4; i++) {
      const v = maxX * i / 4, x = L + PW * (i / 4);
      if (i > 0) svg += el("line", { x1: x, y1: T, x2: x, y2: h - B, stroke: C.line, "stroke-opacity": .5 });
      svg += el("text", { x: x, y: h - B + 16, "text-anchor": "middle", "font-size": 11, fill: MUT, "font-family": "Cairo" }, opts.fmt(v));
    }
    svg += el("line", { x1: L, y1: T, x2: L, y2: h - B, stroke: C.line });
    svg += el("line", { x1: L, y1: h - B, x2: w - R, y2: h - B, stroke: C.line });

    const xP = v => L + PW * (Math.max(0, Math.min(maxX, ok(v) ? v : 0)) / maxX);
    const yP = v => T + PH * (1 - Math.max(0, Math.min(maxY, ok(v) ? v : 0)) / maxY);
    const map = pts => (pts || []).filter(pt => ok(pt.x) && ok(pt.y)).map(pt => [xP(pt.x), yP(pt.y)]);
    const rev = map(opts.revenuePoints), cost = map(opts.costPoints), fixed = map(opts.fixedPoints);
    const poly = pts => pts.map(pt => pt[0].toFixed(1) + "," + pt[1].toFixed(1)).join(" ");

    /* مناطق الخسارة والربح — مفصولة عند نقطة التقاطع الحقيقية */
    if (rev.length > 1 && cost.length > 1) {
      const bx = ok(opts.beX) ? xP(opts.beX) : null;
      const at = (pts, x) => {
        const a = pts[0], b = pts[pts.length - 1];
        if (b[0] === a[0]) return a[1];
        return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
      };
      if (bx !== null && bx > L + 1 && bx < w - R - 1) {
        svg += el("polygon", { points: `${poly([rev[0], [bx, at(rev, bx)]])} ${poly([[bx, at(cost, bx)], cost[0]])}`,
                               fill: C.burgundy, "fill-opacity": .14 });
        svg += el("polygon", { points: `${poly([[bx, at(rev, bx)], rev[rev.length - 1]])} ${poly([cost[cost.length - 1], [bx, at(cost, bx)]])}`,
                               fill: C.emerald, "fill-opacity": .12 });
      } else {
        svg += el("polygon", { points: `${poly(rev)} ${poly(cost.slice().reverse())}`, fill: C.burgundy, "fill-opacity": .12 });
      }
    }
    if (rev.length > 1)   svg += el("path", { d: "M" + rev.map(pt => pt.join(" ")).join(" L"), fill: "none", stroke: C.gold, "stroke-width": 2.6 });
    if (cost.length > 1)  svg += el("path", { d: "M" + cost.map(pt => pt.join(" ")).join(" L"), fill: "none", stroke: C.burgundy, "stroke-width": 2.4 });
    if (fixed.length > 1) svg += el("path", { d: "M" + fixed.map(pt => pt.join(" ")).join(" L"), fill: "none", stroke: C.muted, "stroke-width": 1.8, "stroke-dasharray": "5 4" });

    /* ---- الخطوط الرأسية: تُجمع أولاً ثم تُوزَّع تسمياتها على مسارات بلا تداخل ---- */
    const vlines = [];
    if (ok(opts.beX) && opts.beX > 0)
      vlines.push({ x: opts.beX, label: opts.beLabel, color: C.emerald, wdt: 1.8, dash: "6 4", size: 11.5 });
    if (ok(opts.actualX) && opts.actualX > 0)
      vlines.push({ x: opts.actualX, label: opts.actualLabel, color: C.gold2, wdt: 1.5, dash: "4 4", size: 11 });
    (opts.markers || []).forEach(mk => {
      if (ok(mk.x) && mk.x > 0) vlines.push({ x: mk.x, label: mk.label, color: mk.color || C.blue, wdt: 1.4, dash: "3 4", size: 10.5 });
    });

    vlines.sort((a, b) => a.x - b.x);
    /* توزيع المسارات: تسمية جديدة تنزل سطراً كلما اقتربت أفقياً من سابقتها */
    const LANE_H = 17, MIN_GAP = 118;
    const placed = [];
    vlines.forEach(v => {
      const px = xP(v.x);
      let lane = 0, clash = true;
      while (clash) {
        clash = placed.some(q => q.lane === lane && Math.abs(q.px - px) < MIN_GAP);
        if (clash) lane++;
      }
      /* اتجاه التسمية: تنقلب لليسار قرب الحافة اليمنى حتى لا تخرج من الإطار */
      const flip = px > L + PW * 0.62;
      placed.push({ v, px, lane, flip });
    });

    placed.forEach(pl => {
      svg += el("line", { x1: pl.px, y1: T, x2: pl.px, y2: h - B, stroke: pl.v.color,
                          "stroke-width": pl.v.wdt, "stroke-dasharray": pl.v.dash, "stroke-opacity": .9 });
      const ly = T + 14 + pl.lane * LANE_H;
      const lx = pl.flip ? pl.px - 6 : pl.px + 6;
      svg += el("text", { x: lx, y: ly, "text-anchor": pl.flip ? "end" : "start", "font-size": pl.v.size,
                          fill: pl.v.color, "font-family": "Cairo", "font-weight": 800,
                          stroke: "#0B1626", "stroke-width": 3.4, "paint-order": "stroke",
                          "stroke-linejoin": "round" }, pl.v.label);
    });

    svg += el("text", { x: L + PW / 2, y: h - 8, "text-anchor": "middle", "font-size": 12.5, fill: TCOL, "font-family": "Cairo", "font-weight": 700 }, opts.xLabel);
    return wrap(w, h, svg, opts.legend);
  }

  /* ---------- أشرطة التباين (Variance bars) ---------- */
  function varianceBar(value, maxAbs, w) {
    w = w || 130;
    const half = w / 2;
    const len = Math.min(half, half * Math.abs(value) / maxAbs);
    const neg = value < 0;
    let s = `<svg width="${w}" height="16" viewBox="0 0 ${w} 16" class="vbar">`;
    s += `<line x1="${half}" y1="8" x2="${half}" y2="8" stroke="var(--line)" />`;
    if (len > 1) {
      s += `<rect x="${neg ? half - len : half}" y="4.5" width="${len}" height="7" rx="3.5" fill="${neg ? "var(--burgundy)" : "var(--emerald)"}"/>`;
    }
    s += "</svg>";
    return s;
  }

  /* ---------- مؤشر صغير (Sparkline) ---------- */
  function sparkline(opts) {
    const w = opts.width || 120, h = opts.height || 34;
    const data = opts.data.filter(v => v !== null);
    if (!data.length) return "";
    const max = Math.max(...data), min = Math.min(0, ...data);
    const span = (max - min) || 1;
    const pts = data.map((v, i) => {
      const x = data.length === 1 ? (w / 2) : 3 + (w - 6) * i / (data.length - 1);
      const y = 3 + (h - 6) * (1 - (v - min) / span);
      return [x, y];
    });
    const d = "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
    const last = pts[pts.length - 1];
    let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="spark">`;
    s += `<path d="${d}" fill="none" stroke="${opts.color || C.gold}" stroke-width="1.8" stroke-linecap="round"/>`;
    s += `<circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${opts.color || C.gold}"/>`;
    s += "</svg>";
    return s;
  }

  /* ---------- أسطورة ---------- */
  function legend(items) {
    let s = `<div class="chart-legend">`;
    for (const it of items) {
      const swatch = it.type === "line"
        ? `<span class="lg-dash" style="border-color:${it.color}"></span>`
        : `<span class="lg-box" style="background:${it.color}"></span>`;
      s += `<span class="lg-item">${swatch} ${it.name}</span>`;
    }
    s += "</div>";
    return s;
  }

  function wrap(w, h, svg, legendItems, extraCls) {
    return `<div class="chart-wrap"><div class="chart-svg${extraCls ? " " + extraCls : ""}" style="padding-bottom:${(h / w * 100).toFixed(1)}%;--chart-ar:${w}/${h}">` +
      `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" dir="ltr">${svg}</svg></div>` +
      (legendItems ? legend(legendItems) : "") + "</div>";
  }

  return { lineChart, colChart, comboChart, hbarChart, donutChart, waterfallChart, breakEvenChart, varianceBar, sparkline, niceMax, C };
})();

;
;
/* ============================================================================
   REV — محرك تحليل الإيرادات وقنوات البيع
   Revenue & Sales-Channel Analytics Engine
   كل الدوال تعمل على FIN.years[y][m].revDetail — وتتوسع تلقائياً مع أي شهر جديد.
   ========================================================================== */
const REV = (function () {

  /* تصنيف القنوات: المنطقة الجغرافية ونوع قناة البيع */
  /* تصنيف القنوات.
     قاعدة حاكمة: «المنطقة» تعني فواتير العملاء المباشرة لتلك المنطقة فقط.
     المنطقة الوسطى = Customer Invoices Central (الرياض) — لا شيء غيرها.
     الأمانة والوكلاء والمعارض قنوات بيع مستقلة تُقاس وحدها ولا تُدمج في أي منطقة. */
  const META = {
    central:     { region: "الوسطى — الرياض", type: "فواتير عملاء", group: "مناطق",        isRegion: true  },
    western:     { region: "الغربية",         type: "فواتير عملاء", group: "مناطق",        isRegion: true  },
    madinah:     { region: "المدينة",         type: "فواتير عملاء", group: "مناطق",        isRegion: true  },
    north:       { region: "الشمالية",        type: "فواتير عملاء", group: "مناطق",        isRegion: true  },
    south:       { region: "الجنوبية",        type: "فواتير عملاء", group: "مناطق",        isRegion: true  },
    consignment: { region: "—",               type: "أمانة",        group: "قنوات مستقلة", isRegion: false },
    localAgent:  { region: "—",               type: "وكلاء وتوزيع", group: "قنوات مستقلة", isRegion: false },
    intlAgent:   { region: "—",               type: "وكلاء وتوزيع", group: "قنوات مستقلة", isRegion: false },
    srRiyadh:    { region: "—",               type: "تجزئة/معارض",  group: "قنوات مستقلة", isRegion: false },
    srJeddah:    { region: "—",               type: "تجزئة/معارض",  group: "قنوات مستقلة", isRegion: false },
    srQassim:    { region: "—",               type: "تجزئة/معارض",  group: "قنوات مستقلة", isRegion: false }
  };
  const chAr = k => { const l = FIN.revLines.find(x => x.key === k); return l ? l.ar : k; };
  const chEn = k => { const l = FIN.revLines.find(x => x.key === k); return l ? l.en : k; };
  const keys = () => FIN.revLines.map(l => l.key);

  function months(year, scope) { return E.scopeAvailableMonths(year, scope); }
  function cell(year, m, ch) {
    const d = FIN.years[year] && FIN.years[year][m];
    return (d && d.revDetail && d.revDetail[ch] !== undefined) ? d.revDetail[ch] : 0;
  }
  function chTotal(year, ch, scope) { return months(year, scope).reduce((a, m) => a + cell(year, m, ch), 0); }
  function grand(year, scope) { return months(year, scope).reduce((a, m) => a + E.sum(year, "revenue", [m]), 0); }
  function pct(a, b) { return (b === 0 || b === null) ? null : (a - b) / Math.abs(b) * 100; }

  /* ---------- 1) مصفوفة القنوات: الوزن والنمو وأثر النقطة المئوية ---------- */
  function channels(scope) {
    const T26 = grand(2026, scope), T25 = grand(2025, scope);
    return keys().map(k => {
      const a = chTotal(2026, k, scope), b = chTotal(2025, k, scope);
      const series26 = months(2026, scope).map(m => cell(2026, m, k));
      const series25 = months(2025, scope).map(m => cell(2025, m, k));
      const mu = series26.length ? series26.reduce((x, y) => x + y, 0) / series26.length : 0;
      const sd = series26.length ? Math.sqrt(series26.reduce((x, y) => x + (y - mu) * (y - mu), 0) / series26.length) : 0;
      return {
        key: k, ar: chAr(k), en: chEn(k),
        region: (META[k] || {}).region || "—", type: (META[k] || {}).type || "—",
        group: (META[k] || {}).group || "—", isRegion: !!(META[k] || {}).isRegion,
        v26: a, v25: b,
        w26: T26 ? a / T26 * 100 : 0, w25: T25 ? b / T25 * 100 : 0,
        mixShift: (T26 ? a / T26 * 100 : 0) - (T25 ? b / T25 * 100 : 0),
        growth: pct(a, b), variance: a - b,
        impact: T25 ? (a - b) / T25 * 100 : null,   /* أثر القناة على نمو الإجمالي بالنقاط المئوية */
        avg: mu, sd: sd, cv: mu ? sd / mu * 100 : null,
        min: series26.length ? Math.min.apply(null, series26) : 0,
        max: series26.length ? Math.max.apply(null, series26) : 0,
        series26: series26, series25: series25,
        isNew: b === 0 && a > 0
      };
    }).sort((x, y) => y.v26 - x.v26);
  }

  /* ---------- 2) التجميع حسب المنطقة / النوع ---------- */
  function groupBy(field, scope) {
    const chs = channels(scope);
    const T26 = grand(2026, scope), T25 = grand(2025, scope);
    const map = {};
    chs.forEach(c => {
      const g = c[field];
      if (!map[g]) map[g] = { name: g, v26: 0, v25: 0, members: [] };
      map[g].v26 += c.v26; map[g].v25 += c.v25; map[g].members.push(c.ar);
    });
    return Object.keys(map).map(k => {
      const o = map[k];
      return Object.assign(o, {
        w26: T26 ? o.v26 / T26 * 100 : 0, w25: T25 ? o.v25 / T25 * 100 : 0,
        growth: pct(o.v26, o.v25), variance: o.v26 - o.v25,
        impact: T25 ? (o.v26 - o.v25) / T25 * 100 : null
      });
    }).sort((a, b) => b.v26 - a.v26);
  }

  /* ---------- 3) التركّز: HHI و CR1/CR3/CR5 ---------- */
  function concentration(year, scope) {
    const T = grand(year, scope);
    if (!T) return { hhi: null, cr1: null, cr3: null, cr5: null, shares: [] };
    const sh = keys().map(k => chTotal(year, k, scope) / T * 100).sort((a, b) => b - a);
    const cum = n => sh.slice(0, n).reduce((a, b) => a + b, 0);
    return { hhi: sh.reduce((a, b) => a + b * b, 0), cr1: sh[0], cr3: cum(3), cr5: cum(5), shares: sh };
  }
  function hhiLabel(h) {
    if (h === null) return "—";
    if (h < 1500) return "مشتّت — مخاطر تركّز منخفضة";
    if (h < 2500) return "تركّز متوسط — يستدعي المتابعة";
    return "تركّز مرتفع — مخاطرة اعتماد على قناة واحدة";
  }

  /* ---------- 4) الانحدار الخطي والاتجاه ---------- */
  function regress(v) {
    const n = v.length; if (n < 2) return { slope: 0, intercept: v[0] || 0, r2: 0, predict: () => v[0] || 0 };
    const mx = (n - 1) / 2, my = v.reduce((a, b) => a + b, 0) / n;
    let num = 0, den = 0;
    for (let i = 0; i < n; i++) { num += (i - mx) * (v[i] - my); den += (i - mx) * (i - mx); }
    const slope = den ? num / den : 0, intercept = my - slope * mx;
    const sst = v.reduce((a, b) => a + (b - my) * (b - my), 0);
    const ssr = v.reduce((a, b, i) => a + Math.pow(b - (intercept + slope * i), 2), 0);
    return { slope, intercept, r2: sst ? 1 - ssr / sst : 0, predict: i => intercept + slope * i };
  }
  function trend(year, scope) {
    const ms = months(year, scope);
    const v = ms.map(m => E.sum(year, "revenue", [m]));
    const r = regress(v);
    const mu = v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0;
    const sd = v.length ? Math.sqrt(v.reduce((a, b) => a + (b - mu) * (b - mu), 0) / v.length) : 0;
    const first = v[0] || 0, last = v[v.length - 1] || 0;
    return {
      months: ms, values: v, slope: r.slope, r2: r.r2, avg: mu, sd: sd,
      cv: mu ? sd / mu * 100 : null,
      forecastNext: r.predict(v.length),
      cmgr: (first > 0 && last > 0 && v.length > 1) ? (Math.pow(last / first, 1 / (v.length - 1)) - 1) * 100 : null
    };
  }

  /* ---------- 5) كشف الانكسار الهيكلي (Structural Break) ---------- */
  function structuralBreak(year, scope) {
    const ms = months(year, scope);
    if (ms.length < 3) return null;
    const v = ms.map(m => E.sum(year, "revenue", [m]));
    const lastIdx = v.length - 1;
    const base = v.slice(0, lastIdx);
    const mu = base.reduce((a, b) => a + b, 0) / base.length;
    const sd = Math.sqrt(base.reduce((a, b) => a + (b - mu) * (b - mu), 0) / base.length) || 1;
    const z = (v[lastIdx] - mu) / sd;
    const r = regress(base);
    const expected = r.predict(lastIdx);
    return {
      monthKey: ms[lastIdx], monthAr: E.monthAr(ms[lastIdx]),
      actual: v[lastIdx], baseAvg: mu, baseSlopeExpected: expected,
      gapVsAvg: v[lastIdx] - mu, gapVsAvgPct: mu ? (v[lastIdx] - mu) / mu * 100 : null,
      gapVsTrend: v[lastIdx] - expected,
      z: z, isBreak: Math.abs(z) >= 1.5, severe: Math.abs(z) >= 2
    };
  }

  /* ---------- 6) جسر الانحراف: من إيراد 2025 إلى إيراد 2026 ---------- */
  function bridge(scope) {
    const chs = channels(scope).filter(c => Math.abs(c.variance) > 0);
    const gains = chs.filter(c => c.variance > 0).sort((a, b) => b.variance - a.variance);
    const losses = chs.filter(c => c.variance < 0).sort((a, b) => a.variance - b.variance);
    return {
      start: grand(2025, scope), end: grand(2026, scope),
      gains, losses,
      totalGain: gains.reduce((a, c) => a + c.variance, 0),
      totalLoss: losses.reduce((a, c) => a + c.variance, 0)
    };
  }

  /* ---------- 7) مساهمة الشهر في النمو + تحليل الشهر الأخير ---------- */
  function monthlyBridge(scope) {
    const ms26 = months(2026, scope), ms25 = months(2025, scope);
    const shared = ms26.filter(m => ms25.includes(m));
    const T25 = grand(2025, scope);
    return shared.map(m => {
      const a = E.sum(2026, "revenue", [m]), b = E.sum(2025, "revenue", [m]);
      return { key: m, ar: E.monthAr(m), v26: a, v25: b, variance: a - b,
               growth: pct(a, b), impact: T25 ? (a - b) / T25 * 100 : null };
    });
  }
  function lastMonthDrivers(scope) {
    const ms = months(2026, scope);
    if (!ms.length) return [];
    const last = ms[ms.length - 1];
    const prior = ms.slice(0, -1);
    return keys().map(k => {
      const a = cell(2026, last, k), b = cell(2025, last, k);
      const mu = prior.length ? prior.reduce((x, m) => x + cell(2026, m, k), 0) / prior.length : 0;
      return { key: k, ar: chAr(k), monthKey: last, v: a, vPrior: b,
               yoy: pct(a, b), variance: a - b,
               vsOwnAvg: mu ? (a - mu) / mu * 100 : null, ownAvg: mu };
    }).sort((x, y) => x.variance - y.variance);
  }

  /* ---------- 8) تحليل باريتو 80/20 ---------- */
  function pareto(scope) {
    const chs = channels(scope).filter(c => c.v26 > 0);
    const T = chs.reduce((a, c) => a + c.v26, 0) || 1;
    let cum = 0;
    return chs.map(c => { cum += c.v26; return { ar: c.ar, value: c.v26, pct: c.v26 / T * 100, cumPct: cum / T * 100 }; });
  }

  /* ---------- 9) مؤشرات الجودة: النمو الحقيقي مقابل النمو الاسمي ---------- */
  function quality(scope) {
    const chs = channels(scope);
    const T26 = grand(2026, scope), T25 = grand(2025, scope);
    const growing = chs.filter(c => c.growth !== null && c.growth > 0);
    const shrinking = chs.filter(c => c.growth !== null && c.growth < 0);
    const t26 = trend(2026, scope), t25 = trend(2025, scope);
    const ms26 = months(2026, scope);
    const h1 = ms26.slice(0, -1), lastM = ms26[ms26.length - 1];
    const h1_26 = h1.reduce((a, m) => a + E.sum(2026, "revenue", [m]), 0);
    const h1_25 = h1.reduce((a, m) => a + E.sum(2025, "revenue", [m]), 0);
    return {
      total26: T26, total25: T25, growth: pct(T26, T25),
      growingCount: growing.length, shrinkingCount: shrinking.length, totalCount: chs.length,
      breadth: chs.length ? growing.length / chs.length * 100 : null,   /* اتساع النمو */
      growingValue: growing.reduce((a, c) => a + c.variance, 0),
      shrinkingValue: shrinking.reduce((a, c) => a + c.variance, 0),
      cv26: t26.cv, cv25: t25.cv,
      slope26: t26.slope, slope25: t25.slope,
      cmgr26: t26.cmgr, cmgr25: t25.cmgr,
      exLastGrowth: pct(h1_26, h1_25), exLastLabel: E.monthAr(lastM),
      exLast26: h1_26, exLast25: h1_25
    };
  }


  /* ================= المناطق ================= */
  function isRegionCh(k) { return !!(META[k] || {}).isRegion; }
  function regionKeys() { return keys().filter(isRegionCh); }
  function nonRegionKeys() { return keys().filter(k => !isRegionCh(k)); }
  function regionList() {
    const seen = [];
    regionKeys().forEach(k => { const r = (META[k] || {}).region; if (r && seen.indexOf(r) < 0) seen.push(r); });
    return seen;
  }
  /* قناة واحدة لكل منطقة — فواتير العملاء المباشرة لتلك المنطقة */
  function regionChannels(region) { return regionKeys().filter(k => (META[k] || {}).region === region); }
  /* مجاميع الكتلتين: المناطق مقابل القنوات المستقلة */
  function blockTotals(scope) {
    const T26 = grand(2026, scope), T25 = grand(2025, scope);
    const r26 = regionKeys().reduce((a, k) => a + chTotal(2026, k, scope), 0);
    const r25 = regionKeys().reduce((a, k) => a + chTotal(2025, k, scope), 0);
    const o26 = nonRegionKeys().reduce((a, k) => a + chTotal(2026, k, scope), 0);
    const o25 = nonRegionKeys().reduce((a, k) => a + chTotal(2025, k, scope), 0);
    return {
      regions:  { v26: r26, v25: r25, w26: T26 ? r26 / T26 * 100 : 0, w25: T25 ? r25 / T25 * 100 : 0, growth: pct(r26, r25), count: regionKeys().length },
      channels: { v26: o26, v25: o25, w26: T26 ? o26 / T26 * 100 : 0, w25: T25 ? o25 / T25 * 100 : 0, growth: pct(o26, o25), count: nonRegionKeys().length },
      total: { v26: T26, v25: T25, growth: pct(T26, T25) }
    };
  }
  function regionMonth(year, m, region) { return regionChannels(region).reduce((a, k) => a + cell(year, m, k), 0); }
  function regionTotal(year, region, scope) { return months(year, scope).reduce((a, m) => a + regionMonth(year, m, region), 0); }

  function regions(scope) {
    const T26 = grand(2026, scope), T25 = grand(2025, scope);
    return regionList().map(r => {
      const a = regionTotal(2026, r, scope), b = regionTotal(2025, r, scope);
      const ser = months(2026, scope).map(m => regionMonth(2026, m, r));
      const mu = ser.length ? ser.reduce((x, y) => x + y, 0) / ser.length : 0;
      const sd = ser.length ? Math.sqrt(ser.reduce((x, y) => x + (y - mu) * (y - mu), 0) / ser.length) : 0;
      const rg = regress(ser);
      const RB26 = regionKeys().reduce((x, k) => x + chTotal(2026, k, scope), 0);
      const RB25 = regionKeys().reduce((x, k) => x + chTotal(2025, k, scope), 0);
      const isBase = regionChannels(r).indexOf(BASE_CH) >= 0;
      const vv26 = isBase ? vipTotal(2026, scope) : 0, vv25 = isBase ? vipTotal(2025, scope) : 0;
      return {
        name: r, channels: regionChannels(r).map(chAr), isBase: isBase,
        wReg26: RB26 ? a / RB26 * 100 : 0, wReg25: RB25 ? b / RB25 * 100 : 0,
        ex26: a - vv26, ex25: b - vv25, exGrowth: pct(a - vv26, b - vv25),
        vip26: vv26, vipShare: a ? vv26 / a * 100 : 0,
        v26: a, v25: b, w26: T26 ? a / T26 * 100 : 0, w25: T25 ? b / T25 * 100 : 0,
        mixShift: (T26 ? a / T26 * 100 : 0) - (T25 ? b / T25 * 100 : 0),
        growth: pct(a, b), variance: a - b, impact: T25 ? (a - b) / T25 * 100 : null,
        avg: mu, sd: sd, cv: mu ? sd / mu * 100 : null, slope: rg.slope, r2: rg.r2,
        min: ser.length ? Math.min.apply(null, ser) : 0, max: ser.length ? Math.max.apply(null, ser) : 0,
        series26: ser, series25: months(2025, scope).map(m => regionMonth(2025, m, r))
      };
    }).sort((a, b) => b.v26 - a.v26);
  }

  /* ================= عملاء VIP ================= */
  function vipList() { return (FIN.vipCustomers || []); }
  function vipCell(year, m, key) {
    const y = FIN.vip && FIN.vip[year]; const d = y && y[m];
    return (d && d[key] !== undefined) ? d[key] : 0;
  }
  function vipMonth(year, m) { return vipList().reduce((a, c) => a + vipCell(year, m, c.key), 0); }
  function vipTotal(year, scope) { return months(year, scope).reduce((a, m) => a + vipMonth(year, m), 0); }
  function hasVip() { return vipList().length > 0 && (vipTotal(2026, {}) > 0 || vipTotal(2025, {}) > 0); }

  function vipCustomers(scope) {
    const T26 = grand(2026, scope), T25 = grand(2025, scope);
    const B26 = chTotal(2026, BASE_CH, scope), B25 = chTotal(2025, BASE_CH, scope);
    const ms26 = months(2026, scope), ms25 = months(2025, scope);
    return vipList().map(c => {
      const ser = ms26.map(m => vipCell(2026, m, c.key));
      const pri = ms25.map(m => vipCell(2025, m, c.key));
      const a = ser.reduce((x, y) => x + y, 0), b = pri.reduce((x, y) => x + y, 0);
      const act = ser.filter(v => v > 0).length, actP = pri.filter(v => v > 0).length;
      const mu = ser.length ? a / ser.length : 0;
      const sd = ser.length ? Math.sqrt(ser.reduce((x, y) => x + (y - mu) * (y - mu), 0) / ser.length) : 0;
      const muP = pri.length ? b / pri.length : 0;
      const sdP = pri.length ? Math.sqrt(pri.reduce((x, y) => x + (y - muP) * (y - muP), 0) / pri.length) : 0;
      /* أشهر التوقف المتتالية في نهاية الفترة */
      let dormant = 0;
      for (let i = ser.length - 1; i >= 0 && ser[i] === 0; i--) dormant++;
      const lastIdx = ser.reduce((acc, v, i) => v > 0 ? i : acc, -1);
      /* تركّز: وزن أكبر شهرين من إجمالي العميل */
      const top2 = ser.slice().sort((x, y) => y - x).slice(0, 2).reduce((x, y) => x + y, 0);
      return {
        key: c.key, ar: c.ar, en: c.en, channel: c.channel, region: c.region,
        v26: a, v25: b, variance: a - b, growth: pct(a, b),
        series26: ser, series25: pri,
        activeMonths: act, activeMonths25: actP, totalMonths: ser.length,
        activityShift: act - actP,
        avgActive: act ? a / act : 0, avgActive25: actP ? b / actP : 0,
        cv: mu ? sd / mu * 100 : null, cv25: muP ? sdP / muP * 100 : null,
        max: ser.length ? Math.max.apply(null, ser) : 0,
        max25: pri.length ? Math.max.apply(null, pri) : 0,
        dormantMonths: dormant,
        lastActiveAr: lastIdx >= 0 ? E.monthAr(ms26[lastIdx]) : "—",
        top2Share: a ? top2 / a * 100 : 0,
        shareOfTotal: T26 ? a / T26 * 100 : 0,
        shareOfTotal25: T25 ? b / T25 * 100 : 0,
        shareOfBase: B26 ? a / B26 * 100 : 0,
        shareOfBase25: B25 ? b / B25 * 100 : 0,
        isNew: b === 0 && a > 0,
        isLost: b > 0 && a === 0,
        status: (b === 0 && a > 0) ? "عميل جديد"
              : (a === 0 && b > 0) ? "مفقود"
              : dormant >= 2 ? "متوقف " + dormant + " أشهر"
              : (pct(a, b) !== null && pct(a, b) < -20) ? "متراجع"
              : (pct(a, b) !== null && pct(a, b) > 20) ? "نامٍ" : "مستقر",
        tone: (b === 0 && a > 0) ? "pos" : (a === 0 || dormant >= 2) ? "crit"
              : (pct(a, b) !== null && pct(a, b) < -20) ? "warn" : "neutral"
      };
    }).sort((a, b) => b.v26 - a.v26);
  }

  /* جسر VIP: كيف تغيّر إجمالي VIP بين السنتين ومن المسؤول */
  function vipBridge(scope) {
    const cs = vipCustomers(scope);
    return {
      start: cs.reduce((a, c) => a + c.v25, 0),
      end: cs.reduce((a, c) => a + c.v26, 0),
      items: cs.slice().sort((a, b) => b.variance - a.variance)
    };
  }

  /* أثر VIP على شهر بعينه (لتفسير الانكسار) */
  function vipMonthEffect(scope, monthKey) {
    const ms = months(2026, scope);
    const mk = monthKey || ms[ms.length - 1];
    const w = cell(2026, mk, BASE_CH), p = cell(2025, mk, BASE_CH);
    const v = vipMonth(2026, mk), pv = vipMonth(2025, mk);
    const drop = p - w;
    return {
      monthKey: mk, monthAr: E.monthAr(mk),
      raw26: w, raw25: p, drop: drop,
      vip26: v, vip25: pv, vipDelta: v - pv,
      vipShareOfDrop: drop ? (pv - v) / drop * 100 : null,
      base26: w - v, base25: p - pv,
      baseGrowth: pct(w - v, p - pv),
      /* --- قياس القاعدة ضد أساسها الطبيعي، لا ضد شهر المقارنة وحده ---
         نسبة «% من الانهيار» تقيس مقابل شهر 2025 فقط؛ ولو كان ذلك الشهر
         استثنائياً بسبب دفعة VIP ضخمة، تضخّمت حصة VIP وبدت القاعدة سليمة.
         لذلك نقيس أيضاً قاعدة الشهر مقابل متوسط قاعدة بقية أشهر 2026. */
      baseNorm: (() => {
        const others = ms.filter(x => x !== mk).map(x => cell(2026, x, BASE_CH) - vipMonth(2026, x));
        if (!others.length) return null;
        const mu = others.reduce((a, b) => a + b, 0) / others.length;
        const sd = Math.sqrt(others.reduce((a, b) => a + (b - mu) * (b - mu), 0) / others.length);
        const cur = w - v;
        return { avgOther: mu, sd: sd, current: cur, diff: cur - mu,
                 pctVsAvg: mu ? (cur - mu) / mu * 100 : null,
                 z: sd ? (cur - mu) / sd : null };
      })(),
      /* هل شهر المقارنة في 2025 كان استثنائياً في دفعات VIP؟ */
      priorVipSpike: (() => {
        const others = ms.filter(x => x !== mk).map(x => vipMonth(2025, x));
        if (!others.length) return null;
        const mu = others.reduce((a, b) => a + b, 0) / others.length;
        return { avgOtherVip: mu, currentVip: pv, ratio: mu ? pv / mu : null,
                 isSpike: mu > 0 ? (pv / mu) >= 2.5 : (pv > 0) };
      })(),
      byCustomer: vipList().map(c => {
        const a = vipCell(2026, mk, c.key), b = vipCell(2025, mk, c.key);
        return { ar: chArVip(c.key), v26: a, v25: b, variance: a - b,
                 shareOfDrop: drop ? (b - a) / drop * 100 : null };
      }).sort((x, y) => x.variance - y.variance)
    };
  }
  function chArVip(k) { const c = vipList().find(x => x.key === k); return c ? c.ar : k; }

  /* الأثر: المجموع / المنطقة / القناة — مع VIP وبدونهم */
  function vipImpact(scope) {
    const ms26 = months(2026, scope), ms25 = months(2025, scope);
    const vipCh = {}; vipList().forEach(c => { vipCh[c.channel] = true; });
    const vipRg = {}; vipList().forEach(c => { vipRg[c.region] = true; });
    const regionOf = vipList().length ? vipList()[0].region : null;
    const channelOf = vipList().length ? vipList()[0].channel : null;

    const T26 = grand(2026, scope), T25 = grand(2025, scope);
    const V26 = vipTotal(2026, scope), V25 = vipTotal(2025, scope);

    const R26 = regionOf ? regionTotal(2026, regionOf, scope) : 0;
    const R25 = regionOf ? regionTotal(2025, regionOf, scope) : 0;
    const C26 = channelOf ? chTotal(2026, channelOf, scope) : 0;
    const C25 = channelOf ? chTotal(2025, channelOf, scope) : 0;

    const mk = (a26, a25, v26, v25, label) => ({
      label: label,
      with26: a26, with25: a25, withGrowth: pct(a26, a25),
      ex26: a26 - v26, ex25: a25 - v25, exGrowth: pct(a26 - v26, a25 - v25),
      vip26: v26, vip25: v25,
      vipShare26: a26 ? v26 / a26 * 100 : 0, vipShare25: a25 ? v25 / a25 * 100 : 0,
      swing: (pct(a26, a25) === null || pct(a26 - v26, a25 - v25) === null) ? null
             : pct(a26, a25) - pct(a26 - v26, a25 - v25)
    });

    return {
      total:   mk(T26, T25, V26, V25, "إجمالي الشركة"),
      regionsBlock: (function () {
        const r26 = regionKeys().reduce((a, k) => a + chTotal(2026, k, scope), 0);
        const r25 = regionKeys().reduce((a, k) => a + chTotal(2025, k, scope), 0);
        return mk(r26, r25, V26, V25, "كتلة المناطق (فواتير العملاء)");
      })(),
      region:  regionOf  ? mk(R26, R25, V26, V25, "منطقة " + regionOf) : null,
      channel: channelOf ? mk(C26, C25, V26, V25, chAr(channelOf)) : null,
      regionName: regionOf, channelName: channelOf ? chAr(channelOf) : null,
      monthly: ms26.map(m => {
        const c = cell(2026, m, channelOf), v = vipMonth(2026, m);
        const c25 = cell(2025, m, channelOf), v25m = vipMonth(2025, m);
        return { key: m, ar: E.monthAr(m), withV: c, exV: c - v, vip: v,
                 prior: c25, priorEx: c25 - v25m,
                 vipShare: c ? v / c * 100 : 0,
                 growthWith: pct(c, c25), growthEx: pct(c - v, c25 - v25m) };
      })
    };
  }

  /* تركّز المناطق فيما بينها (فواتير العملاء فقط) */
  function regionConcentration(year, scope) {
    const rk = regionKeys();
    const T = rk.reduce((a, k) => a + chTotal(year, k, scope), 0);
    if (!T) return { hhi: null, cr1: null };
    const sh = rk.map(k => chTotal(year, k, scope) / T * 100).sort((a, b) => b - a);
    return { hhi: sh.reduce((a, b) => a + b * b, 0), cr1: sh[0] };
  }

  /* تركّز مع/بدون VIP — لقياس المخاطرة الحقيقية */
  function concentrationEx(year, scope) {
    const vipCh = {}; vipList().forEach(c => { vipCh[c.channel] = true; });
    const T = grand(year, scope) - vipTotal(year, scope);
    if (!T) return { hhi: null, cr1: null, cr3: null };
    const vals = keys().map(k => chTotal(year, k, scope) - (vipCh[k] ? vipTotal(year, scope) : 0));
    const sh = vals.map(v => v / T * 100).sort((a, b) => b - a);
    return { hhi: sh.reduce((a, b) => a + b * b, 0), cr1: sh[0], cr3: sh.slice(0, 3).reduce((a, b) => a + b, 0) };
  }


  /* ================= المرجع التحليلي: الرياض (Customer Invoices Central) =================
     كل تقييم للأداء يُقاس على هذه القناة لأنها فواتير عملاء المنطقة الوسطى — الرياض،
     وهي مركز النشاط التجاري وأكبر مكوّن للإيراد. */
  const BASE_CH = "central";
  function baseKey() { return BASE_CH; }
  function baseAr() { return chAr(BASE_CH) + " — الرياض"; }

  /* سلسلة الرياض شهرياً: مع VIP وبدونهم */
  function baseSeries(scope) {
    const ms26 = months(2026, scope), ms25 = months(2025, scope);
    return ms26.map(m => {
      const w = cell(2026, m, BASE_CH), v = vipMonth(2026, m);
      const p = cell(2025, m, BASE_CH), pv = vipMonth(2025, m);
      return { key: m, ar: E.monthAr(m), withV: w, vip: v, exV: w - v,
               prior: p, priorEx: p - pv,
               idxWith: p ? w / p * 100 : null, idxEx: (p - pv) ? (w - v) / (p - pv) * 100 : null,
               vipShare: w ? v / w * 100 : 0,
               belowPrior: (w - v) < (p - pv) };
    });
  }

  /* إطار المرجعية: النمو الواجب مقابل المحقق — كل المراجع مشتقة من الداتا نفسها */
  function benchmarks(scope) {
    const ser = baseSeries(scope);
    const n = ser.length || 1;
    const ex = ser.map(x => x.exV), prior = ser.map(x => x.priorEx);
    const sEx = ex.reduce((a, b) => a + b, 0), sPr = prior.reduce((a, b) => a + b, 0);
    const actual = sPr ? (sEx - sPr) / sPr * 100 : null;

    const peak = ex.length ? Math.max.apply(null, ex) : 0;
    const top3 = ex.slice().sort((a, b) => b - a).slice(0, Math.min(3, ex.length));
    const rr3 = top3.length ? top3.reduce((a, b) => a + b, 0) / top3.length : 0;

    /* نمو السوق البديل: متوسط نمو المناطق الأخرى — ما حققته الشركة فعلاً خارج الرياض */
    const othersKeys = keys().filter(k => k !== BASE_CH);
    const o26 = othersKeys.reduce((a, k) => a + chTotal(2026, k, scope), 0);
    const o25 = othersKeys.reduce((a, k) => a + chTotal(2025, k, scope), 0);
    const restGrowth = o25 ? (o26 - o25) / o25 * 100 : null;

    const mk = (id, name, target, basis, note, tier) => ({
      id, name, target, basis, note, tier,
      actual, gap: (actual === null || target === null) ? null : actual - target,
      valueGap: (target === null) ? null : sEx - sPr * (1 + target / 100),
      met: (actual !== null && target !== null) ? actual >= target : null
    });

    return {
      actual, sumEx: sEx, sumPrior: sPr, avgEx: sEx / n, avgPrior: sPr / n, peak, rr3,
      items: [
        mk("hold", "الحد الأدنى — عدم التآكل", 0,
           "الحفاظ على مستوى 2025 دون أي نمو",
           "أضعف مرجع ممكن: ألا تفقد الشركة ما كانت عليه.", "critical"),
        mk("rest", "مواكبة بقية المناطق", restGrowth,
           "متوسط نمو القنوات خارج الرياض",
           "الشركة أثبتت قدرتها على تحقيق هذا المعدل فعلياً في مناطق أخرى — فلا عذر للرياض.", "core"),
        mk("rr3", "معدل التشغيل المثبت", sPr ? (rr3 * n - sPr) / sPr * 100 : null,
           "متوسط أفضل 3 أشهر مُحقَّقة فعلاً",
           "مستوى أثبتت الرياض قدرتها على بلوغه في 3 أشهر — تعميمه على الفترة هدف واقعي لا طموح.", "core"),
        mk("peak", "الطاقة المثبتة", sPr ? (peak * n - sPr) / sPr * 100 : null,
           "تكرار أفضل شهر مُحقَّق فعلاً",
           "سقف مثبت بالأداء الفعلي وليس تقديراً نظرياً.", "stretch")
      ].filter(x => x.target !== null)
    };
  }

  /* ---------- تفاصيل بنود المصروفات: تجميع وتحليل لأي دليل بنود ----------
     يعمل مع opexDetail / mgrDetail / othExpDetail / othIncDetail بنفس المنطق. */
  function expLines(kind) {
    return kind === "opex" ? (FIN.opexLines || [])
         : kind === "mgr" ? (FIN.mgrLines || [])
         : kind === "othExp" ? (FIN.othExpLines || [])
         : (FIN.othIncLines || []);
  }
  function expDetailKey(kind) {
    return kind === "opex" ? "opexDetail" : kind === "mgr" ? "mgrDetail"
         : kind === "othExp" ? "othExpDetail" : "othIncDetail";
  }
  function expCell(year, m, kind, key) {
    const d = FIN.years[year] && FIN.years[year][m];
    const dk = expDetailKey(kind);
    return (d && d[dk] && d[dk][key] !== undefined) ? d[dk][key] : 0;
  }
  /* مصفوفة بنود المصروف: القيمة والوزن والنمو والاتجاه والانتظام لكل بند */
  function expMatrix(kind, scope, year) {
    const y = year || 2025;
    const ms = E.scopeAvailableMonths(y, scope);
    const py = y === 2026 ? 2025 : 2025;
    const msP = E.scopeAvailableMonths(py, scope);
    const lines = expLines(kind);
    const total = lines.reduce((a, l) => a + ms.reduce((x, m) => x + expCell(y, m, kind, l.key), 0), 0);
    const rev = ms.reduce((a, m) => a + E.sum(y, "revenue", [m]), 0);
    const rows = lines.map(l => {
      const series = ms.map(m => expCell(y, m, kind, l.key));
      const v = series.reduce((a, b) => a + b, 0);
      const prior = (y === 2026) ? msP.reduce((a, m) => a + expCell(py, m, kind, l.key), 0) : null;
      const mu = series.length ? v / series.length : 0;
      const sd = series.length ? Math.sqrt(series.reduce((a, b) => a + (b - mu) * (b - mu), 0) / series.length) : 0;
      const rg = regress(series);
      const active = series.filter(x => x !== 0).length;
      return {
        key: l.key, ar: l.ar, en: l.en, value: v, series,
        share: total ? v / total * 100 : null,
        ofRevenue: rev ? v / rev * 100 : null,
        avg: mu, sd, cv: mu ? sd / mu * 100 : null,
        slope: rg.slope, slopePct: mu ? rg.slope / mu * 100 : null,
        activeMonths: active, totalMonths: series.length,
        recurring: active === series.length,
        oneOff: active === 1,
        prior, growth: (prior === null || prior === 0) ? null : (v - prior) / Math.abs(prior) * 100,
        min: series.length ? Math.min.apply(null, series) : 0,
        max: series.length ? Math.max.apply(null, series) : 0
      };
    }).filter(x => x.value !== 0).sort((a, b) => b.value - a.value);
    /* تركّز البنود: هل المصروف محكوم ببنود قليلة؟ */
    const shares = rows.map(r => r.share || 0);
    const cum = n => shares.slice(0, n).reduce((a, b) => a + b, 0);
    return { rows, total, rev, months: ms,
             pctOfRevenue: rev ? total / rev * 100 : null,
             hhi: shares.reduce((a, b) => a + b * b, 0),
             cr3: cum(3), cr5: cum(5),
             recurringTotal: rows.filter(r => r.recurring).reduce((a, r) => a + r.value, 0),
             oneOffTotal: rows.filter(r => r.oneOff).reduce((a, r) => a + r.value, 0) };
  }
  /* الاتجاه الشهري لإجمالي نوع مصروف */
  function expMonthly(kind, scope, year) {
    const y = year || 2025;
    const ms = E.scopeAvailableMonths(y, scope);
    const lines = expLines(kind);
    return ms.map(m => ({
      key: m, ar: E.monthAr(m),
      value: lines.reduce((a, l) => a + expCell(y, m, kind, l.key), 0),
      revenue: E.sum(y, "revenue", [m])
    })).map(x => Object.assign(x, { ratio: x.revenue ? x.value / x.revenue * 100 : null }));
  }

  /* ---------- مقارنة موسّعة بين قنوات البيع ----------
     تقيس كل قناة على 6 أبعاد: الحجم، النمو، تحوّل المزيج، أثر النقاط المئوية،
     الانتظام (CV)، والاتجاه (انحدار خطي) — ثم تصنّفها إلى محرّك/عبء/مستقر. */
  function channelMatrix(scope) {
    const chs = channels(scope);
    const T25 = grand(2025, scope) || 1;
    return chs.map(c => {
      const rg = regress(c.series26);
      const slopePct = c.avg ? rg.slope / c.avg * 100 : 0;
      let role, tone;
      if (c.isNew) { role = "قناة جديدة"; tone = "pos"; }
      else if (c.variance > 0 && c.growth >= 10) { role = "محرّك نمو"; tone = "pos"; }
      else if (c.variance > 0) { role = "نمو محدود"; tone = "warn"; }
      else if (c.growth !== null && c.growth <= -20) { role = "عبء حاد"; tone = "crit"; }
      else if (c.variance < 0) { role = "قناة متآكلة"; tone = "crit"; }
      else { role = "مستقرة"; tone = "neutral"; }
      return Object.assign({}, c, {
        slope: rg.slope, slopePct, r2: rg.r2,
        role, tone,
        contribShare: T25 ? c.variance / T25 * 100 : null,
        stability: c.cv === null ? null : (c.cv < 15 ? "منتظمة" : c.cv < 30 ? "متذبذبة" : "غير منتظمة")
      });
    });
  }

  /* أكبر الرابحين والخاسرين بالريال — من يصنع النمو ومن يأكله */
  function channelWinnersLosers(scope) {
    const m = channelMatrix(scope).filter(c => c.v26 > 0 || c.v25 > 0);
    const up = m.filter(c => c.variance > 0).sort((a, b) => b.variance - a.variance);
    const dn = m.filter(c => c.variance < 0).sort((a, b) => a.variance - b.variance);
    const gained = up.reduce((a, c) => a + c.variance, 0);
    const lost = dn.reduce((a, c) => a + c.variance, 0);
    return { up, dn, gained, lost, net: gained + lost,
             offset: gained ? Math.abs(lost) / gained * 100 : null };
  }

  /* ---------- معيارية نمو المناطق: هل النمو كافٍ فعلاً؟ ----------
     المناطق = فواتير العملاء المباشرة. تُقاس ضد مراجع مشتقة من أداء الشركة نفسها. */
  const REGION_KEYS = () => keys().filter(k => (META[k] || {}).isRegion);
  function regionGrowthAudit(scope) {
    const rk = REGION_KEYS();
    const r26 = rk.reduce((a, k) => a + chTotal(2026, k, scope), 0);
    const r25 = rk.reduce((a, k) => a + chTotal(2025, k, scope), 0);
    const actual = r25 ? (r26 - r25) / r25 * 100 : null;

    /* المرجع 1: أفضل منطقة محقّقة فعلاً (باستثناء الجديدة) */
    const rows = rk.map(k => {
      const a = chTotal(2026, k, scope), b = chTotal(2025, k, scope);
      return { key: k, ar: chAr(k), v26: a, v25: b, growth: pct(a, b), variance: a - b, isNew: b === 0 && a > 0 };
    });
    const est = rows.filter(x => !x.isNew && x.growth !== null);
    const bestRegion = est.length ? est.reduce((x, y) => (y.growth > x.growth ? y : x)) : null;

    /* المرجع 2: أفضل قناة في الشركة كلها */
    const allEst = channels(scope).filter(c => !c.isNew && c.growth !== null);
    const bestChannel = allEst.length ? allEst.reduce((x, y) => (y.growth > x.growth ? y : x)) : null;

    /* المرجع 3: تعويض تآكل القنوات المستقلة — كم كان يجب أن تنمو المناطق
       لتغطية ما فقدته القنوات الأخرى وتصل بالشركة إلى نمو مزدوج الرقم */
    const nonR = keys().filter(k => !(META[k] || {}).isRegion);
    const n26 = nonR.reduce((a, k) => a + chTotal(2026, k, scope), 0);
    const n25 = nonR.reduce((a, k) => a + chTotal(2025, k, scope), 0);
    const nonRegionDrop = n26 - n25;
    const coverTarget = r25 ? ((r25 - nonRegionDrop) - r25) / r25 * 100 : null;

    /* المرجع 4: نمو مزدوج الرقم على مستوى الشركة (10%) — كم تحتاجه المناطق */
    const T25 = grand(2025, scope), T26 = grand(2026, scope);
    const need10 = (T25 && r25) ? ((T25 * 1.10 - n26) - r25) / r25 * 100 : null;

    const mk = (id, name, target, basis, note, tier) => ({
      id, name, target, basis, note, tier, actual,
      gap: (actual === null || target === null) ? null : actual - target,
      valueGap: (target === null) ? null : r26 - r25 * (1 + target / 100),
      met: (actual !== null && target === null) ? null : (actual !== null ? actual >= target : null)
    });
    const items = [
      mk("bestRegion", "مواكبة أفضل منطقة", bestRegion ? bestRegion.growth : null,
         bestRegion ? `${bestRegion.ar} حققت ${bestRegion.growth === null ? "—" : bestRegion.growth.toFixed(1)}%` : "—",
         "معدل أثبتت الشركة قدرتها عليه داخل المناطق نفسها — فليس هدفاً نظرياً.", "core"),
      mk("cover", "تعويض تآكل القنوات المستقلة", coverTarget,
         `القنوات غير الإقليمية فقدت ${Math.round(Math.abs(nonRegionDrop)).toLocaleString()} ريال`,
         "الحد الذي يجعل نمو المناطق يحمي إجمالي الشركة من التراجع.", "critical"),
      mk("dd", "بلوغ نمو مزدوج الرقم للشركة (10%)", need10,
         "ما تحتاجه المناطق لرفع الشركة إلى +10%",
         "الهدف التجاري المعلن لشركة في طور التوسّع.", "stretch"),
      mk("bestChannel", "مواكبة أفضل قناة في الشركة", bestChannel ? bestChannel.growth : null,
         bestChannel ? `${bestChannel.ar} حققت ${bestChannel.growth === null ? "—" : bestChannel.growth.toFixed(1)}%` : "—",
         "سقف مثبت بالأداء الفعلي داخل الشركة.", "stretch")
    ].filter(x => x.target !== null);

    const missed = items.filter(x => x.met === false).length;
    let status, tone;
    if (actual === null) { status = "بانتظار البيانات"; tone = "neutral"; }
    else if (missed >= 3) { status = "النمو غير كافٍ — دون معظم المراجع"; tone = "crit"; }
    else if (missed >= 1) { status = "نمو جزئي — لم يبلغ المراجع الأساسية"; tone = "warn"; }
    else { status = "نمو ضمن المستوى المطلوب"; tone = "pos"; }

    return { rows: rows.sort((a, b) => b.v26 - a.v26), r26, r25, actual, items, missed,
             total: items.length, status, tone, bestRegion, bestChannel,
             nonRegionDrop, weight26: T26 ? r26 / T26 * 100 : null };
  }

  /* تكلفة ضعف الرياض على الشركة كاملة */
  function baseDrag(scope) {
    const ser = baseSeries(scope);
    const sEx = ser.reduce((a, x) => a + x.exV, 0), sPr = ser.reduce((a, x) => a + x.priorEx, 0);
    const shortfall = sPr - sEx;
    const T26 = grand(2026, scope), T25 = grand(2025, scope);
    return {
      shortfall,
      actualGrowth: T25 ? (T26 - T25) / T25 * 100 : null,
      wouldBeTotal: T26 + shortfall,
      wouldBeGrowth: T25 ? (T26 + shortfall - T25) / T25 * 100 : null,
      dragPoints: T25 ? shortfall / T25 * 100 : null,
      monthsBelow: ser.filter(x => x.belowPrior).length, monthsTotal: ser.length
    };
  }

  /* تقييم مركّب لحالة المبيعات */
  function salesVerdict(scope) {
    const b = benchmarks(scope), d = baseDrag(scope), q = quality(scope);
    const imp = vipImpact(scope);
    const missed = b.items.filter(x => x.met === false).length;
    let status, tone;
    const a = b.actual;
    if (a === null) { status = "بانتظار البيانات"; tone = "neutral"; }
    else if (a < -20) { status = "حرج — تآكل حاد في القاعدة"; tone = "crit"; }
    else if (a < 0)   { status = "غير جيد — القاعدة تنكمش"; tone = "crit"; }
    else if (a < (b.items.find(x => x.id === "rest") || {}).target) { status = "دون المستوى — نمو أقل من الواجب"; tone = "warn"; }
    else { status = "ضمن المستوى المطلوب"; tone = "pos"; }
    return { status, tone, missed, total: b.items.length,
             actual: a, drag: d, bench: b, vipSwing: imp.channel ? imp.channel.swing : null };
  }

  return { META, chAr, chEn, keys, cell, chTotal, grand, pct, channels, groupBy,
           concentration, hhiLabel, regress, trend, structuralBreak, bridge,
           monthlyBridge, lastMonthDrivers, pareto, quality, months,
           regionList, regionChannels, regionMonth, regionTotal, regions,
           isRegionCh, regionKeys, nonRegionKeys, blockTotals, regionConcentration,
           vipList, vipCell, vipMonth, vipTotal, hasVip, vipCustomers, vipBridge, vipMonthEffect, vipImpact, concentrationEx,
           baseKey, baseAr, baseSeries, benchmarks, baseDrag, salesVerdict,
           channelMatrix, channelWinnersLosers, regionGrowthAudit, REGION_KEYS,
           expLines, expMatrix, expMonthly, expCell };
})();

/* ============================================================================
   SCENT OF NATURE TRADING L.L.C SAUDI ARABIA — UI COMPONENTS + PAGES (PART 1)
   Executive + Financial Statements

const UI = (function () {

  function h(tag, attrs, inner) {
    let s = "<" + tag;
    for (const k in attrs) {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      s += ` ${k}="${v}"`;
    }
    s += ">" + (inner || "") + "</" + tag + ">";
    return s;
  }

  const toneColor = { pos: "var(--emerald)", warn: "var(--gold)", crit: "var(--burgundy)", opp: "var(--blue)", neutral: "var(--muted)" };

  /* شريط عنوان القسم */
  function sectionHead(num, kicker, title, sub) {
    return `<div class="sec-head">
      <div class="sec-kicker"><span class="sec-num">${num}</span>${kicker}</div>
      <h1 class="sec-title">${title}</h1>
      ${sub ? `<p class="sec-sub">${sub}</p>` : ""}
      <div class="sec-rule"><span></span></div>
    </div>`;
  }

  /* شارة حالة البيانات */
  function pendingBadge() {
    return `<span class="badge-pending">بانتظار البيانات</span>`;
  }
  function phaseBadge() { return ""; }

  /* بطاقة KPI رئيسية */
  function kpiPrimary(o) {
    return `<div class="kpi-primary ${o.tone || ""}" data-goto="${o.goto || ""}">
      <div class="kpi-top">
        <span class="kpi-label">${o.label}</span>
      </div>
      <div class="kpi-value">${o.value}</div>
      <div class="kpi-bottom">
        <span class="kpi-delta ${o.deltaTone || "neutral"}">${o.delta || ""}</span>
        <span class="kpi-note">${o.note || ""}</span>
      </div>
      ${o.info ? `<div class="kpi2-expl">${o.info}</div>` : ""}
      ${o.spark ? `<div class="kpi-spark" dir="ltr">${o.spark}</div>` : ""}
    </div>`;
  }

  /* بطاقة KPI ثانوية */
  function kpiSecondary(o) {
    return `<div class="kpi-secondary ${o.tone || ""}" data-goto="${o.goto || ""}">
      <div class="kpi2-label">${o.label}</div>
      <div class="kpi2-value">${o.value}</div>
      <div class="kpi2-foot"><span class="kpi-delta ${o.deltaTone || "neutral"}">${o.delta || ""}</span><span class="kpi-note">${o.note || ""}</span></div>
      ${o.info ? `<div class="kpi2-expl">${o.info}</div>` : ""}
    </div>`;
  }

  /* لوحة عامة */
  function panel(o) {
    const tone = o.tone ? `panel-${o.tone}` : "";
    return `<section class="panel ${tone}">
      ${o.title ? `<header class="panel-head"><h3>${o.title}</h3>${o.badge || ""}${o.tools || ""}</header>` : ""}
      <div class="panel-body">${o.body || ""}</div>
      ${o.foot ? `<footer class="panel-foot">${o.foot}</footer>` : ""}
    </section>`;
  }

  /* الرؤية المالية */
  function insight(text) {
    return `<div class="insight">
      <div class="insight-head"><svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 0-7 7c0 3.9 3 6.4 3.6 7.5.5.9 1.3 1.5 2.2 1.5h2.4c.9 0 1.7-.6 2.2-1.5.6-1.1 3.6-3.6 3.6-7.5a7 7 0 0 0-7-7z"/><path d="M12 7v4l2.5 2"/></svg><span>الرؤية المالية <em>FINANCIAL INSIGHT</em></span></div>
      <p>${text}</p>
    </div>`;
  }

  /* تركيز الإدارة */
  function focus(items) {
    return `<div class="focus">
      <div class="focus-head"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg><span>تركيز الإدارة <em>MANAGEMENT FOCUS</em></span></div>
      <ul>${items.map(i => `<li>${i}</li>`).join("")}</ul>
    </div>`;
  }

  /* جدول موحد */
  function table(o) {
    const rows = o.rows.map(r => {
      const cells = r.cells.map((c, i) => {
        const cls = [c.cls || "", i > 0 && o.rightAlign ? "num" : "", c.tone ? "tone-" + c.tone : ""].filter(Boolean).join(" ");
        return `<td class="${cls}">${c.html || ""}</td>`;
      }).join("");
      return `<tr class="${r.cls || ""}">${cells}</tr>`;
    }).join("");
    const heads = (o.heads || []).map((hd, i) =>
      `<th class="${(i > 0 && o.rightAlign) ? "num" : ""}">${hd}</th>`).join("");
    return `<div class="tbl-scroll" dir="rtl"><table class="tbl">${heads ? `<thead><tr>${heads}</tr></thead>` : ""}<tbody>${rows}</tbody></table></div>`;
  }

  /* شريحة تباين داخل جدول المقارنة */
  function cmpCells(c, maxAbs, fmtFn, toneWhenDown) {
    const delta = c.variancePct === null ? "—" : E.fmtPct(c.variancePct, { sign: true, digits: 1 });
    const good = c.variancePct !== null && (toneWhenDown ? c.variancePct < 0 : c.variancePct > 0);
    const tone = c.variancePct === null ? "neutral" : (good ? "pos" : "neg");
    return [
      { html: fmtFn(c.actual), cls: "num strong" },
      { html: fmtFn(c.prior), cls: "num dim" },
      { html: fmtFn(c.variance, { sign: true }), cls: `num ${c.variance === 0 ? "dim" : (c.variance > 0 ? "pos" : "neg")}` },
      { html: `<span class="delta-chip ${tone}">${delta}</span>` + CH.varianceBar(c.variancePct, maxAbs || 40, 90), cls: "num" }
    ];
  }

  /* شريحة أداء بين فترتين (Delta) */
  function deltaChip(v, opts) {
    opts = opts || {};
    if (v === null || v === undefined) return `<span class="delta-chip neutral">—</span>`;
    const s = opts.pct !== false ? E.fmtPct(v, { sign: true, digits: 1 }) : E.fmt(v, { sign: true });
    let tone = "neutral";
    if (v > 0) tone = opts.downGood ? "neg" : "pos";
    else if (v < 0) tone = opts.downGood ? "pos" : "neg";
    return `<span class="delta-chip ${tone}">${s}</span>`;
  }

  /* خلية شهر معلّق */
  function pendingCell() {
    return { html: `<span class="pending-cell">بانتظار البيانات</span>`, cls: "num pending" };
  }

  return { h, sectionHead, pendingBadge, phaseBadge, kpiPrimary, kpiSecondary, panel, insight, focus, table, cmpCells, deltaChip, pendingCell, toneColor };
})();

const PAGES = {};
/* مساعدات الصفحات — فحص فراغ البيانات من محرك الحساب */
function noData() { return E.noData(); }
function costsPending(scope, year) { return !E.hasCostData(year || 2026, scope); }
/* شريط تنبيه يوضع أعلى أي صفحة ربحية تعتمد على تكاليف 2026 غير المتوفرة */
function costGuardBanner(scope, year) {
  year = year || 2026;
  if (E.hasCostData(year, scope)) return "";
  return `<div class="verdict-banner crit" style="margin-bottom:18px">
    <strong>تنبيه بيانات:</strong> ${E.costPendingText(year)}
    ${E.hasCostData(2025, scope) ? " القراءات الربحية أدناه تعرض أرقام 2025 الفعلية بدلاً من مقارنة غير صالحة." : ""}
  </div>`;
}

/* ---- مصطلحات النتيجة: تتبدّل تلقائياً بين ربح وخسارة حسب الأرقام الفعلية ---- */
function RES(scope, year) {
  const t = E.totals(year || 2026, scope || { period: "ytd" });
  const p = t.netProfit >= 0;
  return {
    t: t, isProfit: p,
    label: p ? "صافي الربح" : "صافي النتيجة",
    labelShort: p ? "الربح" : "الخسارة",
    verb: p ? "حققت" : "سجّلت",
    tone: p ? "pos" : "crit",
    signed: -t.netProfit,
    fmt: E.fmt(-t.netProfit),
    margin: t.revenue ? -t.netProfit / t.revenue * 100 : null,
    /* شهر: ربح أم خسارة */
    monthLabel: (y, mk) => {
      const d = FIN.years[y] && FIN.years[y][mk];
      if (!d || d.netLoss === undefined) return "—";
      return d.netLoss <= 0 ? "ربح" : "خسارة";
    }
  };
}

/* خلفية الفترة الحالية: تسميات النطاق */
function scopeLabel(scope) {
  if (scope.period === "month") return "شهري — " + E.monthAr(scope.monthKey);
  if (scope.period === "janapr") return "يناير – أبريل";
  if (scope.period === "janjul") return "يناير – يوليو";
  return "التراكمي — منذ بداية السنة";
}
function scopeNote(scope) {
  const av26 = E.available(2026);
  const av25 = E.available(2025);
  if (!av26.length && !av25.length) return "بانتظار تسجيل البيانات — أضِف أرقام الأشهر في FIN.years وستتولَّد كل التحليلات تلقائياً.";
  if (av26.length === E.monthOrder.length && av25.length === E.monthOrder.length) return "";
  const missing25 = E.monthOrder.filter(k => !av25.includes(k)).map(E.monthAr).join("، ");
  const shared = E.monthOrder.filter(k => av26.includes(k) && av25.includes(k));
  return `2026 متاحة حتى ${E.monthAr(av26[av26.length - 1])}. بيانات 2025 متاحة حتى ${E.monthAr(av25[av25.length - 1])} — ${missing25} بانتظار البيانات، والمقارنات مع 2025 تُحسب على الأشهر المشتركة (${shared.length} أشهر) وتتوسع تلقائياً عند اكتمالها.`;
}
