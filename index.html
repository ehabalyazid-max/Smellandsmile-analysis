    const scope = ST.scope;
    const year = ST.stmtYear || 2026;
    const ms = E.scopeMonths(year, scope);
    /* الإشارات مطابقة تماماً للقائمة الأصلية:
       المبيعات والأرباح بعلامة سالبة، والمصروفات بعلامة موجبة */
    const rowsDef = [
      { key: "revenue", name: "الإيرادات", bold: true, sign: -1 },
      { key: "cogs", name: "تكلفة المبيعات", note: "", sign: 1 },
      { key: "grossProfit", name: "الربح الإجمالي", bold: true, sign: -1 },
      { key: "operatingExpenses", name: "المصروفات التشغيلية", sign: 1 },
      { key: "managerialExpenses", name: "المصروفات العمومية والإدارية", sign: 1 },
      { key: "netLoss", name: "صافي النتيجة", bold: true, sign: 1 }
    ];
    const heads = ["البند", ...ms.map(k => E.monthAr(k)), "التراكمي"];
    const ytdAv = E.scopeAvailableMonths(year, scope);
    /* الإجمالي التراكمي من المحرك: يستخدم المجموع المعتمد المنشور في القوائم الأصلية
       عندما يطابق النطاق (يناير–أبريل) — والجمع الخالص لأي نطاق آخر */
    const T = E.totals(year, scope);
    const ytdVals = {
      revenue: T.revenue, cogs: T.cogs, grossProfit: T.grossProfit,
      operatingExpenses: T.operatingExpenses, managerialExpenses: T.managerialExpenses,
      netLoss: T.netLoss
    };
    /* بنود المصروفات التفصيلية تُدرج أسفل كل إجمالي — الوضع الافتراضي مفصّل */
    const showDetail = ST.stmtDetail !== false;
    const detailFor = { operatingExpenses: "opex", managerialExpenses: "mgr" };
    const rows = [];
    rowsDef.forEach(r => {
      const cells = [{ html: `<b>${r.name}</b>${r.note ? `<div class="tbl-note">${r.note}</div>` : ""}` }];
      for (const k of ms) {
        if (E.isPending(year, k)) cells.push(UI.pendingCell());
        else {
          const d = FIN.years[year][k];
          const raw = r.key === "netLoss" ? d.netLoss : d[r.key];
          const v = raw * (r.sign || 1);
          cells.push({ html: E.fmt(v), cls: "num" });
        }
      }
      const tot = (ytdVals[r.key] || 0) * (r.sign || 1);
      cells.push({ html: `<b>${E.fmt(tot)}</b>`, cls: "num ytd" });
      rows.push({ cls: r.bold ? "row-total" : "", cells });

      /* البنود التفصيلية تحت البند المجمّع */
      const kind = detailFor[r.key];
      if (showDetail && kind) {
        const lines = REV.expLines(kind);
        const av = E.scopeAvailableMonths(year, scope);
        const lineTot = l => av.reduce((a, m) => a + REV.expCell(year, m, kind, l.key), 0);
        lines.map(l => ({ l, t: lineTot(l) }))
             .filter(x => x.t !== 0)
             .sort((a, b) => b.t - a.t)
             .forEach(({ l, t }) => {
          const c = [{ html: `<span class="il-name">${l.ar}</span><div class="tbl-note">${l.en || ""}</div>` }];
          for (const k of ms) {
            if (E.isPending(year, k)) c.push(UI.pendingCell());
            else c.push({ html: E.fmt(REV.expCell(year, k, kind, l.key)), cls: "num il-num" });
          }
          c.push({ html: E.fmt(t), cls: "num ytd il-num" });
          rows.push({ cls: "row-item", cells: c });
        });
      }
    });
    /* صف التباين 2026 vs 2025 (YTD) */
    const cmpSign = { revenue: -1, cogs: 1, grossProfit: -1, operatingExpenses: 1, managerialExpenses: 1, netLoss: 1 };
    const cmpNames = { revenue: "الإيرادات", cogs: "تكلفة المبيعات", grossProfit: "الربح الإجمالي", operatingExpenses: "المصروفات التشغيلية", managerialExpenses: "المصروفات الإدارية", netLoss: "صافي النتيجة" };
    const cmpRows = ["revenue", "cogs", "grossProfit", "operatingExpenses", "managerialExpenses", "netLoss"].map(k => {
      const a = E.totals(2026, scope)[k];
      const b = E.totals(2025, scope)[k];
      return { name: cmpNames[k], a, b, var: a - b, varPct: b !== 0 ? (a - b) / Math.abs(b) * 100 : null, sign: cmpSign[k] };
    });
    el.innerHTML = `
    ${costGuardBanner(ST.scope)}
    ${UI.sectionHead("05", "FINANCIAL STATEMENTS · القوائم المالية", "قائمة الدخل", "إجمالي الفترة: إيرادات " + E.fmt(E.totals(2026, scope).revenue) + " ريال · " + RES(scope, 2025).label + " " + E.fmt(E.totals(2026, scope).netLoss) + " ريال · " + scopeLabel(scope))}
    ${UI.phaseBadge()}
    <div class="toolbar">
      <div class="seg" id="stmt-year">
        <button class="seg-btn ${year === 2026 ? "active" : ""}" data-y="2026">2026</button>
        <button class="seg-btn ${year === 2025 ? "active" : ""}" data-y="2025">2025</button>
      </div>
      <div class="seg" id="stmt-detail">
        <button class="seg-btn ${showDetail ? "active" : ""}" data-d="1">مفصّل بالبنود</button>
        <button class="seg-btn ${!showDetail ? "active" : ""}" data-d="0">مجمّع</button>
      </div>
      <span class="toolbar-note">${scopeLabel(scope)} · ${FIN.meta.currency}</span>
    </div>
    ${UI.panel({ title: `قائمة الدخل — ${year}`, badge: `<span class="badge">SAR</span>`, body: UI.table({ heads, rightAlign: true, rows }) })}
    ${UI.panel({ title: "التباين التراكمي — 2026 مقابل 2025", body: UI.table({
      heads: ["البند", "2026", "2025", "التباين", "نسبة التباين"], rightAlign: true,
      rows: cmpRows.map(r => {
        const downGood = ["المصروفات التشغيلية", "المصروفات الإدارية", "تكلفة المبيعات", "صافي النتيجة"].includes(r.name);
        const good = downGood ? r.var < 0 : r.var > 0;
        return { cells: [
          { html: `<b>${r.name}</b>` },
          { html: E.fmt(r.a * r.sign), cls: "num strong" },
          { html: E.fmt(r.b * r.sign), cls: "num dim" },
          { html: E.fmt(r.var, { sign: true }), cls: `num ${good ? "pos" : "neg"}` },
          { html: `<span class="delta-chip ${r.varPct === null ? "neutral" : (good ? "pos" : "neg")}">${r.varPct === null ? "—" : E.fmtPct(r.varPct, { sign: true, digits: 1 })}</span>`, cls: "num" }
        ]};
      })
    })})}
    ${UI.insight(noData() ? E.pendingText() : (() => { const rc = E.compare("revenue", scope), nc = E.compare("netLoss", scope), sal = E.salaryOpTotal(scope); let s = `على مدار الأشهر المتاحة (${T.monthCount} أشهر) بلغت الإيرادات ${E.fmt(T.revenue)} ريال مقابل ${E.fmt(E.totals(2025, scope).revenue)} ريال في 2025${rc.variancePct === null ? "" : ` (${E.fmtPct(rc.variancePct, { sign: true, digits: 1 })})`}، وبلغ ${T.resultLabel} ${E.fmt(T.resultSigned)} ريال${nc.variancePct === null ? "" : ` (${E.fmtPct(nc.variancePct, { sign: true, digits: 1 })})`}. `; s += `العبء الأكبر على النتيجة: المصروفات التشغيلية ${E.fmt(T.operatingExpenses)} ريال (${E.fmtPct(T.opexRatio)} من الإيرادات) والرواتب التشغيلية ${E.fmt(sal)} ريال (${E.fmtPct(T.revenue ? sal / T.revenue * 100 : null)} من الإيرادات) مقابل هامش ربح إجمالي ${E.fmtPct(T.grossMargin)} — ${T.operatingExpenses > T.grossProfit ? "التشغيل يفوق الربح الإجمالي بالكامل" : "التشغيل ضمن حدود الربح الإجمالي"}.`; return s; })())}
    `;
  }
};

/* =================================================================
   6) REVENUE — الإيرادات
   ================================================================= */
PAGES["revenue"] = {
  num: "06", kicker: "FINANCIAL STATEMENTS · القوائم المالية",
  title: "الإيرادات وقنوات البيع", sub: "تحليل شامل — الاتجاه، المزيج، النمو، التركّز والجودة",
  render(el, ST) {
    const scope = ST.scope;
    const t26 = E.totals(2026, scope), t25 = E.totals(2025, scope);
    const labels = E.scopeMonths(2026, scope).map(E.monthAr);
    const s26 = E.monthlySigned(2026, "revenue", scope), s25 = E.monthlySigned(2025, "revenue", scope);
    const raw26 = E.monthly(2026, "revenue", scope), raw25 = E.monthly(2025, "revenue", scope);
    const bw = E.bestWorst(2026, "revenue", scope);
    const cmp = E.compare("revenue", scope);

    const chs   = REV.channels(scope);
    const q     = REV.quality(scope);
    const con26 = REV.concentration(2026, scope), con25 = REV.concentration(2025, scope);
    const tr26  = REV.trend(2026, scope), tr25 = REV.trend(2025, scope);
    const brk   = REV.structuralBreak(2026, scope);
    const br    = REV.bridge(scope);
    const mb    = REV.monthlyBridge(scope);
    const drv   = REV.lastMonthDrivers(scope);
    const par   = REV.pareto(scope);
    const byReg = REV.groupBy("region", scope);
    const byTyp = REV.groupBy("type", scope);

    const PAL = [CH.C.gold, CH.C.emerald, CH.C.blue, CH.C.teal, CH.C.navy2, CH.C.burgundy,
                 CH.C.gold2, CH.C.muted, "#B08D57", "#8FBF9F", "#C9A96A"];
    const num  = v => E.fmt(v);
    const sgn  = v => E.fmt(v, { sign: true });
    const pctS = (v, d) => v === null ? "—" : E.fmtPct(v, { digits: d === undefined ? 1 : d });

    /* ============ KPI ============ */
    const kpis = `
    <div class="kpi-row">
      ${UI.kpiPrimary({ label: "إجمالي الإيرادات", value: E.fmtS("revenue", t26.revenue), note: "ريال سعودي · " + scopeLabel(scope),
        delta: `${pctS(cmp.variancePct)} مقابل 2025 (${E.fmtS("revenue", t25.revenue)})`, deltaTone: q.growth > 0 ? "pos" : "neg",
        info: "الإيراد يُعرض بالسالب التزاماً بإشارات القوائم الأصلية.",
        spark: CH.sparkline({ data: raw26.map(x => x.value), color: CH.C.gold }) })}
      ${UI.kpiPrimary({ label: "نمو الرياض — القاعدة الحقيقية", value: pctS(REV.benchmarks(scope).actual, 1),
        note: `${REV.baseAr()} باستبعاد عملاء VIP`, tone: "crit",
        delta: `مقابل ${pctS(REV.vipImpact(scope).channel.withGrowth)} بالصورة الظاهرية`, deltaTone: "neg",
        info: "المرجع المعتمد لتقييم المبيعات — فواتير عملاء الرياض دون طلبات VIP غير المتكررة." })}
      ${UI.kpiPrimary({ label: "اتساع النمو (Breadth)", value: pctS(q.breadth, 0), note: `${q.growingCount} قناة نامية من ${q.totalCount}`,
        delta: `${q.shrinkingCount} قناة متراجعة`, deltaTone: q.breadth >= 50 ? "pos" : "neg",
        info: "نسبة القنوات النامية — النمو المرتكز على قناة واحدة هش." })}
      ${UI.kpiPrimary({ label: "تركّز المبيعات HHI", value: num(con26.hhi), note: REV.hhiLabel(con26.hhi),
        delta: `${sgn(con26.hhi - con25.hhi)} مقابل 2025`, deltaTone: con26.hhi > con25.hhi ? "neg" : "pos",
        info: "مؤشر هيرفندال: أعلى = اعتماد أكبر على قنوات قليلة." })}
    </div>
    <div class="kpi-row">
      ${UI.kpiSecondary({ label: "أعلى شهر", value: num(bw.best.v), note: E.monthAr(bw.best.key), delta: "الذروة", deltaTone: "pos" })}
      ${UI.kpiSecondary({ label: "أدنى شهر", value: num(bw.worst.v), note: E.monthAr(bw.worst.key), delta: "القاع", deltaTone: "neg" })}
      ${UI.kpiSecondary({ label: "المتوسط الشهري", value: num(tr26.avg), note: "2025: " + num(tr25.avg),
        delta: pctS(REV.pct(tr26.avg, tr25.avg), 1), deltaTone: tr26.avg > tr25.avg ? "pos" : "neg" })}
      ${UI.kpiSecondary({ label: "تذبذب الإيراد CV", value: pctS(tr26.cv), note: "2025: " + pctS(tr25.cv),
        delta: tr26.cv < tr25.cv ? "استقرار أعلى" : "تذبذب أعلى", deltaTone: tr26.cv < tr25.cv ? "pos" : "neg",
        info: "الانحراف المعياري ÷ المتوسط — أقل = إيراد أكثر انتظاماً." })}
      ${mb.length < 3 ? "" : UI.kpiSecondary({ label: "الاتجاه (الميل)", value: sgn(Math.round(tr26.slope)) + " ر.س/شهر", note: `R² = ${tr26.r2.toFixed(3)}`,
        delta: tr26.slope > 0 ? "مسار صاعد" : "مسار هابط", deltaTone: tr26.slope > 0 ? "pos" : "neg" })}
      ${UI.kpiSecondary({ label: "CMGR", value: pctS(tr26.cmgr, 2), note: "معدل النمو الشهري المركّب",
        delta: "2025: " + pctS(tr25.cmgr, 2), deltaTone: (tr26.cmgr || 0) > 0 ? "pos" : "neg" })}
    </div>`;

    /* ============ الاتجاه الشهري ============ */
    const trendPanel = UI.panel({ title: "منحنى الإيرادات الشهري — 2026 مقابل 2025",
      body: CH.lineChart({ labels, series: [
        { name: "2026", color: CH.C.gold, data: s26.map(x => x.value) },
        { name: "2025", color: CH.C.navy2, data: s25.map(x => x.value), dash: "5 4" }
      ], yFmt: v => E.fmt(v), valueLabels: true,
        legend: [{ name: "2026", type: "line", color: CH.C.gold }, { name: "2025", type: "line", color: CH.C.navy2 }] }),
      foot: "" });

    const varPanel = UI.panel({ title: "الفارق الشهري عن 2025 — أين تولّد النمو وأين ضاع",
      body: CH.colChart({ labels: mb.map(m => m.ar), series: [{ name: "الفارق", color: CH.C.gold,
        data: mb.map(m => m.variance) }], yFmt: v => E.fmt(v) }),
      foot: "" });

    /* ============ جدول شهري ============ */
    const maxMV = Math.max.apply(null, mb.map(m => Math.abs(m.variance))) || 1;
    const monthRows = mb.map(m => ({ cells: [
      { html: `<b>${m.ar}</b>` },
      { html: E.fmt(-m.v26), cls: "num strong" },
      { html: E.fmt(-m.v25), cls: "num dim" },
      { html: sgn(m.variance), cls: "num" },
      { html: UI.deltaChip(m.growth), cls: "num" },
      { html: UI.deltaChip(E.mom(2026, "revenue", m.key)), cls: "num" },
      { html: `<span dir="ltr">${CH.varianceBar(m.variance, maxMV, 110)}</span>`, cls: "num" },
      { html: pctS(m.impact, 2), cls: "num" }
    ]}));
    monthRows.push({ cls: "row-total", cells: [
      { html: "<b>الإجمالي</b>" },
      { html: E.fmtS("revenue", t26.revenue), cls: "num strong" },
      { html: E.fmtS("revenue", t25.revenue), cls: "num dim" },
      { html: sgn(t26.revenue - t25.revenue), cls: "num" },
      { html: UI.deltaChip(q.growth), cls: "num" },
      { html: "—", cls: "num" }, { html: "", cls: "num" },
      { html: pctS(q.growth, 2), cls: "num" }
    ]});
    const monthTable = UI.panel({ title: "التفاصيل الشهرية ومساهمة كل شهر في النمو",
      body: UI.table({ heads: ["الشهر", "2026", "2025", "الفارق", "YoY", "MoM", "الاتجاه", "أثر على النمو"], rightAlign: true, rows: monthRows }),
      foot: "" });

    /* ============ القنوات ============ */
    const donut = CH.donutChart({ size: 260, segments: chs.filter(c => c.v26 > 0).map((c, i) => ({ label: c.ar, name: c.ar, value: c.v26, color: PAL[i % PAL.length] })), fmt: num });
    const hbar = CH.hbarChart({ items: chs.filter(c => c.v26 > 0).map((c, i) => ({ label: c.ar, value: c.v26, pct: c.w26, color: PAL[i % PAL.length] })), fmt: num, left: 190 });
    const mixPanel = UI.panel({ title: "مزيج قنوات البيع 2026 — الوزن النسبي",
      body: `<div class="chart-split"><div class="cs-a" dir="ltr">${donut}</div><div class="cs-b">${hbar}</div></div>`,
      foot: `أعلى قناة تستحوذ على ${pctS(con26.cr1)} · أعلى 3 قنوات ${pctS(con26.cr3)} · أعلى 5 ${pctS(con26.cr5)}.` });

    const maxCV = Math.max.apply(null, chs.map(c => Math.abs(c.variance))) || 1;
    const chRows = chs.map(c => ({ cells: [
      { html: `<b>${c.ar}</b><div class="tbl-note">${c.en} · ${c.region} · ${c.type}</div>` },
      { html: num(c.v26), cls: "num strong" },
      { html: pctS(c.w26), cls: "num" },
      { html: num(c.v25), cls: "num dim" },
      { html: pctS(c.w25), cls: "num dim" },
      { html: c.isNew ? `<span class="delta-chip pos">قناة جديدة</span>` : UI.deltaChip(c.growth), cls: "num" },
      { html: sgn(c.variance), cls: "num" },
      { html: `<span dir="ltr">${CH.varianceBar(c.variance, maxCV, 110)}</span>`, cls: "num" },
      { html: pctS(c.mixShift, 1) === "—" ? "—" : E.fmtPct(c.mixShift, { sign: true, digits: 1 }) + " ن.م", cls: "num" },
      { html: c.impact === null ? "—" : E.fmtPct(c.impact, { sign: true, digits: 2 }), cls: "num" },
      { html: pctS(c.cv), cls: "num" }
    ]}));
    chRows.push({ cls: "row-total", cells: [
      { html: "<b>الإجمالي</b>" }, { html: num(q.total26), cls: "num strong" }, { html: "100.0%", cls: "num" },
      { html: num(q.total25), cls: "num dim" }, { html: "100.0%", cls: "num dim" },
      { html: UI.deltaChip(q.growth), cls: "num" }, { html: sgn(q.total26 - q.total25), cls: "num" },
      { html: "", cls: "num" }, { html: "—", cls: "num" }, { html: pctS(q.growth, 2), cls: "num" }, { html: pctS(tr26.cv), cls: "num" }
    ]});
    const chTable = UI.panel({ title: "مصفوفة قنوات البيع — الأداء الكامل",
      body: UI.table({ heads: ["القناة", "2026", "وزن", "2025", "وزن", "النمو", "الفارق", "الاتجاه", "تغيّر المزيج", "أثر على النمو", "التذبذب"], rightAlign: true, rows: chRows }),
      foot: "" });

    /* ============ جسر الانحراف ============ */
    const bridgeSteps = [{ key: "s", label: "إيراد 2025", value: br.start, kind: "subtotal" }]
      .concat(br.gains.map(c => ({ key: c.key, label: c.ar, value: c.variance, kind: "rev" })))
      .concat(br.losses.map(c => ({ key: c.key, label: c.ar, value: c.variance, kind: "cost" })))
      .concat([{ key: "e", label: "إيراد 2026", value: br.end, kind: "total" }]);
    const bridgePanel = UI.panel({ title: "جسر الإيراد — من 2025 إلى 2026 حسب القناة",
      body: CH.waterfallChart({ steps: bridgeSteps, fmt: num, zeroBased: true }),
      foot: `مكاسب ${sgn(br.totalGain)} من ${br.gains.length} قنوات · خسائر ${sgn(br.totalLoss)} من ${br.losses.length} قنوات · الصافي ${sgn(br.end - br.start)}.` });

    /* ============ المنطقة والنوع ============ */
    const grpTable = g => UI.table({ heads: ["المجموعة", "2026", "وزن", "2025", "وزن", "النمو", "الفارق", "أثر"], rightAlign: true,
      rows: g.map(x => ({ cells: [
        { html: `<b>${x.name}</b><div class="tbl-note">${x.members.join(" · ")}</div>` },
        { html: num(x.v26), cls: "num strong" }, { html: pctS(x.w26), cls: "num" },
        { html: num(x.v25), cls: "num dim" }, { html: pctS(x.w25), cls: "num dim" },
        { html: UI.deltaChip(x.growth), cls: "num" }, { html: sgn(x.variance), cls: "num" },
        { html: x.impact === null ? "—" : E.fmtPct(x.impact, { sign: true, digits: 2 }), cls: "num" }
      ]}))});
    const regPanel = UI.panel({ title: "الأداء حسب المنطقة الجغرافية", body: grpTable(byReg) });
    const typPanel = UI.panel({ title: "الأداء حسب نوع قناة البيع", body: grpTable(byTyp) });

    /* ============ باريتو ============ */
    const p80 = par.find(x => x.cumPct >= 80);
    const p80n = p80 ? par.indexOf(p80) + 1 : par.length;
    const paretoPanel = UI.panel({ title: "تحليل باريتو 80/20 — تركيز الإيراد",
      body: CH.comboChart({ labels: par.map(x => x.ar),
        columns: [{ name: "الإيراد", color: CH.C.gold, data: par.map(x => x.value) }],
        line: { name: "التراكمي %", color: CH.C.emerald, data: par.map(x => x.cumPct) },
        yFmtC: v => E.fmt(v), yFmtL: v => E.fmtPct(v, { digits: 0 }) }),
      foot: `${p80n} قنوات فقط تُولّد ${pctS(par[p80n - 1] ? par[p80n - 1].cumPct : 100)} من الإيراد — أي خلل في إحداها ينعكس مباشرة على الإجمالي.` });

    /* ============ الانكسار الهيكلي ============ */
    const brkPanel = brk ? UI.panel({ tone: brk.severe ? "crit" : (brk.isBreak ? "warn" : ""),
      title: `اختبار الانكسار الهيكلي — ${brk.monthAr} ${brk.isBreak ? "(انحراف جوهري)" : "(ضمن النطاق الطبيعي)"}`,
      body: `<div class="stat-grid">
        <div class="stat"><span class="st-l">فعلي ${brk.monthAr}</span><b class="st-v">${num(brk.actual)}</b></div>
        <div class="stat"><span class="st-l">متوسط الأشهر السابقة</span><b class="st-v">${num(brk.baseAvg)}</b></div>
        <div class="stat"><span class="st-l">المتوقع حسب الاتجاه</span><b class="st-v">${num(brk.baseSlopeExpected)}</b></div>
        <div class="stat"><span class="st-l">الفجوة عن المتوسط</span><b class="st-v ${brk.gapVsAvg < 0 ? "neg" : "pos"}">${sgn(brk.gapVsAvg)} (${E.fmtPct(brk.gapVsAvgPct, { sign: true, digits: 1 })})</b></div>
        <div class="stat"><span class="st-l">الفجوة عن خط الاتجاه</span><b class="st-v ${brk.gapVsTrend < 0 ? "neg" : "pos"}">${sgn(brk.gapVsTrend)}</b></div>
        <div class="stat"><span class="st-l">درجة الانحراف Z-Score</span><b class="st-v ${Math.abs(brk.z) >= 2 ? "neg" : ""}">${brk.z.toFixed(2)}σ</b></div>
      </div>`,
      foot: "" }) : "";

    const drvRows = drv.map(d => ({ cells: [
      { html: `<b>${d.ar}</b>` },
      { html: num(d.v), cls: "num strong" },
      { html: num(d.vPrior), cls: "num dim" },
      { html: sgn(d.variance), cls: "num" },
      { html: UI.deltaChip(d.yoy), cls: "num" },
      { html: num(Math.round(d.ownAvg)), cls: "num dim" },
      { html: UI.deltaChip(d.vsOwnAvg), cls: "num" }
    ]}));
    const drvPanel = brk ? UI.panel({ title: `محرّكات ${brk.monthAr} — القناة التي صنعت الفرق`,
      body: UI.table({ heads: ["القناة", brk.monthAr + " 2026", brk.monthAr + " 2025", "الفارق", "YoY", "متوسطها 2026", "مقابل متوسطها"], rightAlign: true, rows: drvRows }),
      foot: "" }) : "";

    /* ============ التركّز ============ */
    const conPanel = UI.panel({ title: "مؤشرات التركّز ومخاطر الاعتماد",
      body: `<div class="stat-grid">
        <div class="stat"><span class="st-l">HHI 2026</span><b class="st-v">${num(con26.hhi)}</b><span class="st-n">${REV.hhiLabel(con26.hhi)}</span></div>
        <div class="stat"><span class="st-l">HHI 2025</span><b class="st-v">${num(con25.hhi)}</b><span class="st-n">${REV.hhiLabel(con25.hhi)}</span></div>
        <div class="stat"><span class="st-l">CR1 — أكبر قناة</span><b class="st-v">${pctS(con26.cr1)}</b><span class="st-n">2025: ${pctS(con25.cr1)}</span></div>
        <div class="stat"><span class="st-l">CR3 — أكبر 3</span><b class="st-v">${pctS(con26.cr3)}</b><span class="st-n">2025: ${pctS(con25.cr3)}</span></div>
        <div class="stat"><span class="st-l">CR5 — أكبر 5</span><b class="st-v">${pctS(con26.cr5)}</b><span class="st-n">2025: ${pctS(con25.cr5)}</span></div>
        <div class="stat"><span class="st-l">قنوات نامية</span><b class="st-v">${q.growingCount} / ${q.totalCount}</b><span class="st-n">اتساع ${pctS(q.breadth, 0)}</span></div>
      </div>`,
      foot: "" });

    /* ============ الحكم على جودة النمو — بمرجعية الرياض ============ */
    const sv  = REV.salesVerdict(scope);
    const bm  = sv.bench;
    const drg = sv.drag;
    const vimp = REV.vipImpact(scope);
    const baseSer = REV.baseSeries(scope);

    const benchRows = bm.items.map(b => ({
      cls: b.met === false ? "row-miss" : "",
      cells: [
        { html: `<b>${b.name}</b><div class="tbl-note">${b.basis}</div>` },
        { html: E.fmtPct(b.target, { sign: true, digits: 1 }), cls: "num strong" },
        { html: E.fmtPct(b.actual, { sign: true, digits: 1 }), cls: "num" },
        { html: `<b class="neg-t">${E.fmtPct(b.gap, { sign: true, digits: 1 })} ن.م</b>`, cls: "num" },
        { html: b.valueGap === null ? "—" : `<b class="neg-t">${E.fmt(Math.round(b.valueGap), { sign: true })}</b>`, cls: "num" },
        { html: b.met === false ? `<span class="delta-chip neg">لم يتحقق</span>` : `<span class="delta-chip pos">تحقق</span>`, cls: "num" }
      ]}));

    const benchPanel = UI.panel({ tone: "crit",
      title: `النمو الواجب مقابل المحقق — بمرجعية ${REV.baseAr()}`,
      body: `<div class="verdict-banner ${sv.tone}">
          <span class="vb-l">تقييم حالة المبيعات</span>
          <b class="vb-v">${sv.status}</b>
          <span class="vb-n">لم تتحقق ${sv.missed} من ${sv.total} مراجع أداء — القاعدة الأساسية للرياض (باستبعاد عملاء VIP) سجّلت ${E.fmtPct(bm.actual, { sign: true, digits: 2 })}</span>
        </div>
        ${UI.table({ heads: ["مرجع الأداء", "النمو الواجب", "المحقق فعلياً", "الفجوة", "فجوة القيمة (ريال)", "الحالة"], rightAlign: true, rows: benchRows })}`,
      foot: "" });

    const dragPanel = UI.panel({ tone: "crit", title: "تكلفة ضعف الرياض على الشركة كاملة",
      body: `<div class="stat-grid">
        <div class="stat"><span class="st-l">النمو المُعلن للشركة</span><b class="st-v">${E.fmtPct(drg.actualGrowth, { sign: true })}</b><span class="st-n">الصورة الظاهرية</span></div>
        <div class="stat"><span class="st-l">لو حافظت الرياض على 2025 فقط</span><b class="st-v pos">${E.fmtPct(drg.wouldBeGrowth, { sign: true })}</b><span class="st-n">${E.fmt(Math.round(drg.wouldBeTotal))} ريال</span></div>
        <div class="stat"><span class="st-l">نقاط النمو المفقودة</span><b class="st-v neg">${E.fmtPct(drg.dragPoints, { digits: 1 })}</b><span class="st-n">أهدرتها الرياض وحدها</span></div>
        <div class="stat"><span class="st-l">العجز بالريال</span><b class="st-v neg">${E.fmt(Math.round(drg.shortfall))}</b><span class="st-n">دون مستوى 2025</span></div>
        <div class="stat"><span class="st-l">أشهر دون مستوى 2025</span><b class="st-v neg">${drg.monthsBelow} / ${drg.monthsTotal}</b><span class="st-n">القاعدة بلا VIP</span></div>
        <div class="stat"><span class="st-l">تجميل VIP للقناة</span><b class="st-v neg">${E.fmtPct(sv.vipSwing, { sign: true, digits: 1 })} ن.م</b><span class="st-n">الفارق مع/بدون</span></div>
      </div>`,
      foot: `المبيعات ليست في وضع جيد. الرياض، وهي مركز النشاط ومرجع القياس، كلّفت الشركة ${E.fmtPct(drg.dragPoints, { digits: 1 })} نقطة نمو. النمو كان يجب أن يكون ${E.fmtPct(drg.wouldBeGrowth, { sign: true })} على الأقل بمجرد عدم التآكل، فجاء ${E.fmtPct(drg.actualGrowth, { sign: true })}.` });

    const idxPanel = UI.panel({ title: `مؤشر الرياض الشهري (2025 = 100) — مع VIP وبدونهم`,
      body: CH.lineChart({ labels: baseSer.map(x => x.ar), series: [
          { name: "مع VIP", color: CH.C.gold, data: baseSer.map(x => x.idxWith) },
          { name: "بدون VIP (القاعدة)", color: CH.C.burgundy, data: baseSer.map(x => x.idxEx) },
          { name: "خط 2025 = 100", color: CH.C.muted, data: baseSer.map(() => 100), dash: "5 4" }
        ], yFmt: v => E.fmt(v), legend: [
          { name: "مع VIP", type: "line", color: CH.C.gold },
          { name: "بدون VIP", type: "line", color: CH.C.burgundy },
          { name: "مستوى 2025", type: "line", color: CH.C.muted }] }),
      foot: "" });

    const verdictPanel = `${benchPanel}${dragPanel}${idxPanel}`;

    const topGain = br.gains[0], topLoss = br.losses[0];
    const insightTxt = `المبيعات ليست في وضع جيد، والرقم المُعلن يخفي ذلك. بمرجعية ${REV.baseAr()} — فواتير عملاء الرياض، مركز النشاط التجاري — سجّلت القاعدة الحقيقية ${E.fmtPct(bm.actual, { sign: true, digits: 2 })} بعد استبعاد طلبات عملاء VIP غير المتكررة، مقابل ${E.fmtPct(vimp.channel.withGrowth, { sign: true, digits: 2 })} في الصورة الظاهرية — أي تجميل بمقدار ${E.fmtPct(vimp.channel.swing, { sign: true, digits: 1 })} نقطة. النمو كان يجب أن يكون أعلى من ذلك بكثير: لم تبلغ الشركة أياً من ${sv.total} مراجع أداء مشتقة من أدائها الذاتي، بما فيها أضعفها على الإطلاق — مجرد عدم التآكل — التي تخلّفت عنها بـ ${E.fmtPct(bm.items[0].gap, { sign: true, digits: 1 })} نقطة و${E.fmt(Math.round(Math.abs(bm.items[0].valueGap)))} ريال. والدليل على أن المستوى الأعلى كان ممكناً: بقية المناطق ${(((bm.items.find(x => x.id === "rest") || {}).target) || 0) >= 0 ? "نمت" : "تراجعت"} ${E.fmtPct((bm.items.find(x => x.id === "rest") || {}).target, { sign: true, digits: 1 })} في الفترة نفسها وبالإدارة نفسها، والرياض ذاتها بلغت ${E.fmt(Math.round(bm.rr3))} ريال شهرياً في أفضل ثلاثة أشهر لها — أي أن الفجوة قصور في الأداء لا سقف في السوق. النتيجة على مستوى الشركة: الرياض وحدها أهدرت ${E.fmtPct(drg.dragPoints, { digits: 1 })} نقطة نمو، فبدل ${E.fmtPct(drg.wouldBeGrowth, { sign: true })} جاء الإجمالي ${E.fmtPct(drg.actualGrowth, { sign: true })}.`;

    const focusItems = [
      `<b>المبيعات دون المستوى الواجب:</b> قاعدة الرياض ${E.fmtPct(bm.actual, { sign: true, digits: 1 })} بينما الحد الأدنى المقبول صفر — عجز ${E.fmt(Math.round(Math.abs(bm.items[0].valueGap)))} ريال. رفع الأداء إلى مستوى أفضل 3 أشهر مُحقَّقة فعلاً (${E.fmt(Math.round(bm.rr3))} ريال/شهر) يسترد ${E.fmt(Math.round(Math.abs(bm.items.find(x => x.id === "rr3").valueGap)))} ريال.`,
      `<b>مرجع القياس بقية المناطق:</b> نمت ${E.fmtPct((bm.items.find(x => x.id === "rest") || {}).target, { sign: true, digits: 1 })} بينما الرياض ${E.fmtPct(bm.actual, { sign: true, digits: 1 })} — الفارق ${E.fmtPct(bm.items.find(x => x.id === "rest").gap, { sign: true, digits: 1 })} نقطة داخل الشركة الواحدة يستوجب مراجعة إدارة المبيعات في الرياض تحديداً.`,
      topLoss ? `<b>معالجة أكبر تراجع:</b> انخفضت ${topLoss.ar} بمقدار ${sgn(topLoss.variance)} ريال (${pctS(topLoss.growth)}). يُوصى بتحديد مسبّبات التراجع وبيان ما إذا كان مردّه فقدان عملاء أو تغيّر شروط التعامل أو تحوّلاً إلى القنوات المباشرة.` : "",
      "",
      `<b>تخفيف التركّز:</b> ${pctS(con26.cr1)} من الإيراد في قناة واحدة و${pctS(con26.cr3)} في ثلاث — وضع سقف مستهدف لحصة القناة الأكبر وخطة لرفع مساهمة القنوات الأصغر.`,
      `<b>تثبيت المكاسب:</b> ${topGain ? `سجّلت ${topGain.ar} نمواً قدره ${pctS(topGain.growth)}` : "سجّلت القنوات النامية أداءً إيجابياً"}. يُوصى بتثبيت هذا المستوى عبر عقود إطارية أو التزامات حجم سنوية بدلاً من الاعتماد على الطلبات المتفرقة.`,
      chs.filter(c => c.isNew).length ? `<b>القنوات الجديدة:</b> ${chs.filter(c => c.isNew).map(c => c.ar).join("، ")} بدأت هذا العام — تقييم جدواها ومنحها مستهدفاً واضحاً قبل توسيع الإنفاق عليها.` : "",
      `<b>ضبط المعارض:</b> قنوات التجزئة تمثل ${pctS(byTyp.filter(x => x.name === "تجزئة/معارض").reduce((a, x) => a + x.w26, 0))} فقط من الإيراد — قرار صريح مطلوب: استثمار لرفع الإنتاجية أم إعادة توجيه التكلفة.`
    ].filter(Boolean);

    el.innerHTML = `
    ${UI.sectionHead("06", "FINANCIAL STATEMENTS · القوائم المالية", "الإيرادات وقنوات البيع",
      `إجمالي المبيعات: ${E.fmtS("revenue", t26.revenue)} ريال · ${scopeLabel(scope)} · ${chs.filter(c => c.v26 > 0).length} قناة بيع`)}
    ${kpis}
    ${verdictPanel}
    ${trendPanel}
    ${varPanel}
    ${monthTable}
    ${brkPanel}
    ${drvPanel}
    ${mixPanel}
    ${chTable}
    ${bridgePanel}
    ${paretoPanel}
    ${regPanel}
    ${typPanel}
    ${conPanel}
    ${UI.insight(insightTxt)}
    `;
  }
};

/* =================================================================
   7) COST OF SALES — تكلفة المبيعات
   ================================================================= */
/* =================================================================
   مبيعات المناطق — REGIONAL SALES & VIP CONCENTRATION
   ================================================================= */
PAGES["regional-sales"] = {
  num: "07", kicker: "FINANCIAL STATEMENTS · القوائم المالية",
  title: "مبيعات المناطق", sub: "المناطق = فواتير العملاء المباشرة فقط · الوسطى (الرياض) هي المرجع · القنوات الأخرى مفصولة",
  render(el, ST) {
    const scope = ST.scope;
    const regs = REV.regions(scope);
    const vips = REV.vipCustomers(scope);
    const imp  = REV.vipImpact(scope);
    const chs  = REV.channels(scope);
    const T26 = REV.grand(2026, scope), T25 = REV.grand(2025, scope);
    const labels = REV.months(2026, scope).map(E.monthAr);
    const PAL = [CH.C.gold, CH.C.emerald, CH.C.blue, CH.C.teal, CH.C.burgundy, CH.C.navy2];
    const num = v => E.fmt(v), sgn = v => E.fmt(v, { sign: true });
    const pctS = (v, d) => v === null || v === undefined ? "—" : E.fmtPct(v, { digits: d === undefined ? 1 : d });
    const sgnPct = (v, d) => v === null || v === undefined ? "—" : E.fmtPct(v, { sign: true, digits: d === undefined ? 1 : d });

    const CENTRAL = imp.regionName || "الوسطى";
    const central = regs.find(r => r.name === CENTRAL) || regs[0];
    const others = regs.filter(r => r !== central);

    /* ============ KPI ============ */
    const kpis = `
    <div class="kpi-row">
      ${UI.kpiPrimary({ label: `منطقة ${CENTRAL} — الإيراد`, value: num(central.v26),
        note: `${pctS(central.w26)} من إجمالي الشركة · ${central.channels.length} قنوات`,
        delta: `${sgnPct(central.growth)} مقابل 2025`, deltaTone: central.growth > 0 ? "pos" : "neg",
        info: "المنطقة المركزية — تتركز فيها غالبية النشاط التجاري.",
        spark: CH.sparkline({ data: central.series26, color: CH.C.gold }) })}
      ${UI.kpiPrimary({ label: "مبيعات عملاء VIP", value: num(imp.total.vip26),
        note: `${pctS(imp.total.vipShare26)} من إجمالي الشركة · ${vips.length} عملاء`,
        delta: `${pctS(imp.channel ? imp.channel.vipShare26 : 0)} من ${imp.channelName}`, deltaTone: "warn",
        info: "عملاء استراتيجيون كبار — أرقامهم جزء من فواتير المنطقة الوسطى." })}
      ${UI.kpiPrimary({ label: "نمو الشركة بدون VIP", value: sgnPct(imp.total.exGrowth),
        note: `مقابل ${sgnPct(imp.total.withGrowth)} مع احتسابهم`, tone: imp.total.exGrowth < 0 ? "crit" : "",
        delta: `فارق ${sgnPct(imp.total.swing)} نقطة`, deltaTone: "neg",
        info: "الاختبار الحاسم: هل النمو من القاعدة أم من عملاء قلائل؟" })}
      ${UI.kpiPrimary({ label: `نمو ${CENTRAL} بدون VIP`, value: sgnPct(imp.region ? imp.region.exGrowth : null),
        note: `مقابل ${sgnPct(imp.region ? imp.region.withGrowth : null)} مع احتسابهم`,
        tone: imp.region && imp.region.exGrowth < 0 ? "crit" : "",
        delta: `فارق ${sgnPct(imp.region ? imp.region.swing : null)} نقطة`, deltaTone: "neg" })}
    </div>`;

    /* ============ فصل الكتلتين ============ */
    const blk = REV.blockTotals(scope);
    const rConc = REV.regionConcentration(2026, scope);
    const nonReg = chs.filter(c => !REV.isRegionCh(c.key));
    const sepPanel = UI.panel({ title: "أساس التصنيف — المناطق مقابل القنوات المستقلة",
      body: `<div class="note-rule">«المنطقة» في هذا التقرير تعني <b>فواتير العملاء المباشرة</b> لتلك المنطقة فقط. المنطقة الوسطى = <b>${REV.chAr("central")} (الرياض)</b> ولا شيء غيرها. أما ${nonReg.map(c => c.ar).join(" و")} فهي <b>قنوات بيع مستقلة</b> تُقاس وحدها ولا تُدمج في أي منطقة.</div>
      ${UI.table({ heads: ["الكتلة", "2026", "وزن", "2025", "وزن", "النمو", "الفارق", "عدد"], rightAlign: true, rows: [
        { cls: "row-hl", cells: [
          { html: `<b>المناطق</b><div class="tbl-note">فواتير العملاء المباشرة</div>` },
          { html: num(blk.regions.v26), cls: "num strong" }, { html: pctS(blk.regions.w26), cls: "num" },
          { html: num(blk.regions.v25), cls: "num dim" }, { html: pctS(blk.regions.w25), cls: "num dim" },
          { html: UI.deltaChip(blk.regions.growth), cls: "num" }, { html: sgn(blk.regions.v26 - blk.regions.v25), cls: "num" },
          { html: blk.regions.count, cls: "num" } ]},
        { cells: [
          { html: `<b>قنوات مستقلة</b><div class="tbl-note">${nonReg.map(c => c.ar).join(" · ")}</div>` },
          { html: num(blk.channels.v26), cls: "num strong" }, { html: pctS(blk.channels.w26), cls: "num" },
          { html: num(blk.channels.v25), cls: "num dim" }, { html: pctS(blk.channels.w25), cls: "num dim" },
          { html: UI.deltaChip(blk.channels.growth), cls: "num" }, { html: sgn(blk.channels.v26 - blk.channels.v25), cls: "num" },
          { html: blk.channels.count, cls: "num" } ]},
        { cls: "row-total", cells: [
          { html: "<b>إجمالي الشركة</b>" }, { html: num(blk.total.v26), cls: "num strong" }, { html: "100.0%", cls: "num" },
          { html: num(blk.total.v25), cls: "num dim" }, { html: "100.0%", cls: "num dim" },
          { html: UI.deltaChip(blk.total.growth), cls: "num" }, { html: sgn(blk.total.v26 - blk.total.v25), cls: "num" },
          { html: blk.regions.count + blk.channels.count, cls: "num" } ]}
      ]})}`,
      foot: `المناطق ${pctS(blk.regions.w26)} من الإيراد بنمو ${sgnPct(blk.regions.growth)} · القنوات المستقلة ${pctS(blk.channels.w26)} بنمو ${sgnPct(blk.channels.growth)}.` });

    const vb = REV.vipBridge(scope);

    /* ============ الحكم ============ */
    const verdict = UI.panel({ title: "تقييم أداء القاعدة بعد عزل العملاء الاستراتيجيين", tone: "crit",

          <div class="split-seg seg-vip" style="width:${Math.max(0, Math.min(100, vme.vipShareOfDrop || 0))}%">

          </div>

            <span>تراجع القاعدة ${pctS(100 - (vme.vipShareOfDrop || 0), 0)}</span>
          </div>
        </div>
        <div class="split-n">القسم الأيمن (غياب VIP) يبدو كبيراً <b>فقط لأن شهر المقارنة كان استثنائياً</b> — وليس دليلاً على أن القاعدة بخير.</div>
      </div>

      ${UI.table({ heads: ["الرقم", "القيمة", "ماذا يعني؟"], rightAlign: true, rows: [
        { cells: [
          { html: `<b>القاعدة مقابل معدّلها الطبيعي</b>` },
          { html: `<b class="neg-t">${bn ? sgnPct(bn.pctVsAvg, 1) : "—"}</b>${baseGapVal !== null ? `<div class="tbl-note">${sgn(baseGapVal)} ريال</div>` : ""}`, cls: "num" },
          { html: `<b>المقياس المعتمد</b> — ضعف حقيقي في المبيعات الأساسية لا يفسّره غياب أي عميل.` }
        ]},
        { cls: "row-miss", cells: [
          { html: `نمو القاعدة مقابل ${M} 2025` },
          { html: `${sgnPct(vme.baseGrowth, 1)}`, cls: "num" },
          { html: `رقم مضلِّل — يقارن بشهر تضخّم بدفعة VIP استثنائية.` }
        ]},
        { cls: "row-miss", cells: [
          { html: `حصة VIP من الفارق` },
          { html: `${pctS(vme.vipShareOfDrop, 1)}<div class="tbl-note">${num(vipGapVal)} ريال</div>`, cls: "num" },
          { html: `صحيح حسابياً لكنه لا يبرّئ القاعدة — يقيس مقابل الشهر الاستثنائي نفسه.` }
        ]}
      ]})}

      <div class="note-line" style="margin-top:14px">حركة عملاء VIP في ${M}:</div>
      ${UI.table({ heads: ["العميل", `${M} 2026`, `${M} 2025`, "الفارق"], rightAlign: true,
        rows: vme.byCustomer.map(c => ({ cells: [
          { html: `<b>${c.ar}</b>` },
          { html: num(c.v26), cls: "num strong" },
          { html: num(c.v25), cls: "num dim" },
          { html: sgn(c.variance), cls: "num" }
        ]})) })}`,
      foot: `<b>الخلاصة:</b> التراجع سببه <b>ضعف المبيعات الأساسية</b> — القاعدة ${bn ? sgnPct(bn.pctVsAvg, 1) : "—"} تحت معدّلها الطبيعي. غياب دفعة VIP ضخّم حجم الفارق بصرياً لأن ${M} 2025 كان شهراً استثنائياً، لكنه ليس السبب الجذري.` });
    })();

    /* ============ مع/بدون VIP ============ */
    const scen = [imp.total, imp.region, imp.channel].filter(Boolean);
    const scenRows = scen.map(x => ({ cells: [
      { html: `<b>${x.label}</b>` },
      { html: num(x.with26), cls: "num strong" }, { html: num(x.with25), cls: "num dim" },
      { html: UI.deltaChip(x.withGrowth), cls: "num" },
      { html: num(x.ex26), cls: "num strong" }, { html: num(x.ex25), cls: "num dim" },
      { html: UI.deltaChip(x.exGrowth), cls: "num" },
      { html: `<b class="neg-t">${sgnPct(x.swing)} ن.م</b>`, cls: "num" },
      { html: pctS(x.vipShare26), cls: "num" }
    ]}));
    /* ============ الحكم: صورة 2026 بدون عملاء VIP ============ */
    const exV = (() => {
      const T26 = REV.grand(2026, scope), T25 = REV.grand(2025, scope);
      const V26 = REV.vipTotal(2026, scope), V25 = REV.vipTotal(2025, scope);
      const b26 = T26 - V26, b25 = T25 - V25;
      const withG = T25 ? (T26 - T25) / T25 * 100 : null;
      const exG = b25 ? (b26 - b25) / b25 * 100 : null;
      const ms = REV.months(2026, scope);
      const monthly = ms.map(k => {
        const a = E.sum(2026, "revenue", [k]) - REV.vipMonth(2026, k);
        const b = E.sum(2025, "revenue", [k]) - REV.vipMonth(2025, k);
        return { ar: E.monthAr(k), ex26: a, ex25: b, g: b ? (a - b) / b * 100 : null };
      });
      return { T26, T25, V26, V25, b26, b25, withG, exG,
               swing: (withG === null || exG === null) ? null : withG - exG,
               lost: b26 - b25, vipW: T26 ? V26 / T26 * 100 : null,
               vipG: V25 ? (V26 - V25) / V25 * 100 : null,
               down: monthly.filter(m => m.g !== null && m.g < 0).length,
               monthly };
    })();

    const exVerdict = UI.panel({ tone: "crit",
      title: "لو استبعدنا مبيعات عملاء VIP — كيف تبدو 2026 حقاً؟",
      body: `<div class="verdict-banner crit">
        <strong>بدون عملاء VIP تتحوّل 2026 من نمو إلى انكماش: من ${sgnPct(exV.withG, 2)} إلى <b>${sgnPct(exV.exG, 2)}</b></strong>
        <span class="vb-n">الصورة المعلنة تُظهر نمواً ${sgnPct(exV.withG, 2)}، لكن هذا النمو لا يأتي من اتساع قاعدة العملاء: عند عزل عملاء VIP تظهر مبيعات الشركة الأساسية وقد <b>تراجعت ${num(Math.abs(exV.lost))} ريال</b> عن 2025 — أي ${sgnPct(exV.exG, 2)}. الفارق بين الصورتين <b>${sgnPct(exV.swing, 2)} نقطة مئوية</b> هو حجم التجميل الذي يحدثه عملاء VIP.</span>
      </div>
      <div class="stat-grid">
        <div class="stat"><span class="st-l">النمو المعلن (مع VIP)</span><b class="st-v pos">${sgnPct(exV.withG, 2)}</b><span class="st-n">${num(exV.T25)} ← ${num(exV.T26)}</span></div>
        <div class="stat"><span class="st-l">النمو الحقيقي (بدون VIP)</span><b class="st-v neg">${sgnPct(exV.exG, 2)}</b><span class="st-n">${num(exV.b25)} ← ${num(exV.b26)}</span></div>
        <div class="stat"><span class="st-l">حجم التجميل</span><b class="st-v neg">${sgnPct(exV.swing, 2)} ن.م</b><span class="st-n">الفارق بين الصورتين</span></div>
        <div class="stat"><span class="st-l">ما فقدته القاعدة</span><b class="st-v neg">${num(exV.lost)}</b><span class="st-n">ريال مقابل 2025</span></div>
        <div class="stat"><span class="st-l">وزن VIP من مبيعات 2026</span><b class="st-v">${pctS(exV.vipW, 2)}</b><span class="st-n">${num(exV.V26)} ريال</span></div>
        <div class="stat"><span class="st-l">أشهر سالبة بدون VIP</span><b class="st-v neg">${exV.down} / ${exV.monthly.length}</b><span class="st-n">مقابل 2025</span></div>
      </div>
      ${UI.table({ heads: ["الشهر", "2026 بدون VIP", "2025 بدون VIP", "النمو بدون VIP"], rightAlign: true,
        rows: exV.monthly.map(m => ({ cls: (m.g !== null && m.g < 0) ? "row-miss" : "", cells: [
          { html: `<b>${m.ar}</b>` },
          { html: num(m.ex26), cls: "num strong" },
          { html: num(m.ex25), cls: "num dim" },
          { html: UI.deltaChip(m.g), cls: "num" }
        ]})).concat([{ cls: "row-total", cells: [
          { html: "<b>الإجمالي</b>" },
          { html: num(exV.b26), cls: "num strong" },
          { html: num(exV.b25), cls: "num dim" },
          { html: UI.deltaChip(exV.exG), cls: "num" }
        ]}]) })}
`,
      foot: `بلغ نمو العملاء الاستراتيجيين ${sgnPct(exV.vipG, 1)}، ومصدره إحلال تعامل جديد محل آخر تراجعت حركته، في مقابل انكماش القاعدة الاعتيادية. وتركّز ${pctS(exV.vipW, 1)} من المبيعات لدى عدد محدود من العملاء يجعل نتائج الشهر حساسة لتوقيت توريداتهم، وهو ما ظهر أثره في يوليو.` });

    const scenTable = UI.panel({ title: "اختبار العزل — النتيجة مع عملاء VIP وبدونهم", tone: "crit",
      body: UI.table({ heads: ["النطاق", "2026 مع", "2025 مع", "النمو مع", "2026 بدون", "2025 بدون", "النمو بدون", "الفارق", "وزن VIP"], rightAlign: true, rows: scenRows }),
      foot: "" });

    const exChart = UI.panel({ title: `${imp.channelName} شهرياً — مع VIP وبدونهم مقابل 2025`,
      body: CH.lineChart({ labels: imp.monthly.map(m => m.ar), series: [
        { name: "2026 مع VIP", color: CH.C.gold, data: imp.monthly.map(m => m.withV) },
        { name: "2026 بدون VIP", color: CH.C.burgundy, data: imp.monthly.map(m => m.exV) },
        { name: "2025", color: CH.C.navy2, data: imp.monthly.map(m => m.prior), dash: "5 4" }
      ], yFmt: v => E.fmt(v), legend: [
        { name: "2026 مع VIP", type: "line", color: CH.C.gold },
        { name: "2026 بدون VIP", type: "line", color: CH.C.burgundy },
        { name: "2025", type: "line", color: CH.C.navy2 }] }),
      foot: "" });

    const mRows = imp.monthly.map(m => ({ cells: [
      { html: `<b>${m.ar}</b>` },
      { html: num(m.withV), cls: "num strong" }, { html: num(m.vip), cls: "num" },
      { html: pctS(m.vipShare), cls: "num" }, { html: num(m.exV), cls: "num strong" },
      { html: num(m.prior), cls: "num dim" },
      { html: UI.deltaChip(m.growthWith), cls: "num" },
      { html: UI.deltaChip(m.growthEx), cls: "num" }
    ]}));
    const mTable = UI.panel({ title: `التفصيل الشهري — ${imp.channelName}`,
      body: UI.table({ heads: ["الشهر", "مع VIP", "منها VIP", "وزن VIP", "بدون VIP", "2025", "YoY مع", "YoY بدون"], rightAlign: true, rows: mRows }) });

    /* ============ التركّز ============ */
    const c26 = REV.concentration(2026, scope), cEx = REV.concentrationEx(2026, scope);
    const conc = UI.panel({ title: "أثر VIP على مخاطر التركّز",
      body: `<div class="stat-grid">
        <div class="stat"><span class="st-l">HHI مع VIP</span><b class="st-v">${num(c26.hhi)}</b><span class="st-n">${REV.hhiLabel(c26.hhi)}</span></div>
        <div class="stat"><span class="st-l">HHI بدون VIP</span><b class="st-v">${num(cEx.hhi)}</b><span class="st-n">${REV.hhiLabel(cEx.hhi)}</span></div>
        <div class="stat"><span class="st-l">أكبر قناة مع VIP</span><b class="st-v">${pctS(c26.cr1)}</b></div>
        <div class="stat"><span class="st-l">أكبر قناة بدون VIP</span><b class="st-v">${pctS(cEx.cr1)}</b></div>
        <div class="stat"><span class="st-l">وزن VIP من الشركة</span><b class="st-v neg">${pctS(imp.total.vipShare26)}</b></div>
        <div class="stat"><span class="st-l">وزن VIP من ${CENTRAL}</span><b class="st-v neg">${pctS(imp.region.vipShare26)}</b></div>
      </div>`,
      foot: "" });

    /* ============ رؤية وتوصيات ============ */
    const worst = others.slice().sort((a, b) => (a.growth || 0) - (b.growth || 0))[0];
    const best  = others.slice().sort((a, b) => (b.growth || 0) - (a.growth || 0))[0];
    const insight = `بعد فصل القنوات، المنطقة الوسطى تعني حصراً ${imp.channelName} (الرياض): ${num(central.v26)} ريال، أي ${pctS(central.wReg26)} من كتلة المناطق و${pctS(central.w26)} من الشركة. نمت ${sgnPct(central.growth)} ظاهرياً، لكن باستبعاد عملاء VIP الذين يمثلون ${pctS(central.vipShare)} من إيرادها تنقلب إلى ${sgnPct(central.exGrowth)}، بفارق ${sgnPct(imp.channel.swing)} نقطة. الفصل يكشف أيضاً أن كتلة المناطق نمت ${sgnPct(blk.regions.growth)} بينما القنوات المستقلة تراجعت ${sgnPct(blk.channels.growth)}، وأن نمو المناطق كله تقريباً مصدره الرياض، وبدون VIP ينقلب إلى ${sgnPct(imp.regionsBlock.exGrowth)}. تركّز المناطق مرتفع جداً: HHI ${num(rConc.hhi)} وحصة الرياض ${pctS(rConc.cr1)} — أي أن الشركة تعتمد على مدينة واحدة في فواتيرها المباشرة. وعلى مستوى الشركة كاملة ينقلب النمو من ${sgnPct(imp.total.withGrowth)} إلى ${sgnPct(imp.total.exGrowth)}. وتتّسم تعاملات هذه الفئة بطبيعة مشروعية غير دورية، ${vips.map(v => `${v.ar} بحركة في ${v.activeMonths} من ${v.totalMonths} أشهر`).join("، ")}، وهو نمط معتاد لهذا النوع من العملاء ويُراعى عند بناء التقديرات الشهرية. ${best ? `خارج ${CENTRAL}، أفضل أداء ${best.name} (${sgnPct(best.growth)})` : ""}${worst ? ` وأضعفها ${worst.name} (${sgnPct(worst.growth)})` : ""}.`;

    const focus = [
      `<b>تركّز جغرافي حاد:</b> الرياض وحدها ${pctS(central.wReg26)} من فواتير العملاء المباشرة (HHI ${num(rConc.hhi)})، وهو مستوى تركّز مرتفع يجعل نتائج الشركة مرتبطة بسوق جغرافي واحد. ويُوصى برفع مساهمة الغربية والجنوبية والمدينة كتوجّه هيكلي.`,
      `<b>القاعدة تتآكل:</b> ${imp.channelName} بدون VIP سجلت ${sgnPct(imp.channel.exGrowth)} — يجب تحليل قاعدة العملاء العاديين: كم عميلاً فُقد؟ وكم انخفض متوسط الطلب؟ هذا هو المؤشر الحقيقي لصحة النشاط.`,
      `<b>تثبيت VIP تعاقدياً:</b> ${num(imp.total.vip26)} ريال (${pctS(imp.total.vipShare26)} من الإيراد) معتمدة على ${vips.length} عملاء بأشهر نشاط متقطعة — التحول لعقود إطارية سنوية بحد أدنى للحجم يحوّل هذا الإيراد من متقلب إلى مستقر.`,
      `<b>خطة بديلة فورية:</b> فقدان أي من عملاء VIP يعني خسارة تصل إلى ${num(Math.max.apply(null, vips.map(v => v.v26)))} ريال — يجب وجود خط أنابيب عملاء بديل بحجم مكافئ.`,
      `<b>تنويع جغرافي:</b> ${CENTRAL} تمثل ${pctS(central.w26)} والمناطق الأخرى مجتمعة ${pctS(100 - central.w26)} فقط${worst ? ` — و${worst.name} تتراجع ${sgnPct(worst.growth)}` : ""}. وضع مستهدف صريح لرفع مساهمة المناطق خارج المركز.`,
      `<b>تصحيح لوحة القيادة:</b> اعتماد "النمو بدون VIP" كمؤشر رسمي بجانب النمو الإجمالي — القراءة الحالية تُظهر ${sgnPct(imp.total.withGrowth)} بينما الواقع التشغيلي ${sgnPct(imp.total.exGrowth)}.`
    ];

    el.innerHTML = `
    ${UI.sectionHead("07", "FINANCIAL STATEMENTS · القوائم المالية", "مبيعات المناطق",
      `${regs.length} مناطق · ${CENTRAL} ${pctS(central.w26)} من الإيراد · عملاء VIP ${pctS(imp.total.vipShare26)} · ${scopeLabel(scope)}`)}
    ${kpis}
    ${verdict}
    ${regCompare}
    ${regChart}
    ${regDonut}
    ${baseFocus}
    ${cenDeep}
    ${chCompare}
    ${regionAudit}
    ${vmePanel}
    ${exVerdict}
    ${scenTable}
    ${exChart}
    ${mTable}
    ${conc}
    ${UI.insight(insight)}
    `;
  }
};

/* ============================================================================
   تفاصيل بنود المصروفات — صفحة عامة تخدم التشغيلية والعمومية والإدارية
   ========================================================================== */
function renderExpDetailPage(el, ST, cfg) {
  const scope = ST.scope;
  const year = ST.stmtYear || 2026;
  const kind = cfg.kind;
  const num = v => E.fmt(v), sgn = v => E.fmt(v, { sign: true });
  const pctS = (v, d) => (v === null || v === undefined) ? "—" : E.fmtPct(v, { digits: d === undefined ? 1 : d });
  const sgnPct = (v, d) => (v === null || v === undefined) ? "—" : E.fmtPct(v, { sign: true, digits: d === undefined ? 1 : d });

  /* لا بيانات تكلفة للسنة المختارة؟ اعرض 2025 بدل أصفار */
  const hasY = E.hasCostData(year, scope);
  const useYear = hasY ? year : 2025;
  const M = REV.expMatrix(kind, scope, useYear);
  const monthly = REV.expMonthly(kind, scope, useYear);

  if (!M.rows.length) {
    el.innerHTML = `${UI.sectionHead(cfg.num, cfg.kicker, cfg.title, cfg.sub)}
      ${UI.panel({ title: cfg.title, body: `<div class="chart-empty">${E.costPendingText(year)}</div>` })}`;
    return;
  }

  const top = M.rows[0];
  const labels = monthly.map(m => m.ar);

  const rows = M.rows.map(r => ({ cells: [
    { html: `<b>${r.ar}</b><div class="tbl-note">${r.en || ""}</div>` },
    { html: num(r.value), cls: "num strong" },
    { html: pctS(r.share, 1), cls: "num" },
    { html: pctS(r.ofRevenue, 2), cls: "num" },
    { html: num(Math.round(r.avg)), cls: "num" },
    { html: `${r.activeMonths} / ${r.totalMonths}`, cls: "num" },
    { html: pctS(r.cv, 0), cls: "num" },
    { html: `<b class="${(r.slopePct || 0) > 0 ? "neg-t" : "pos-t"}">${sgnPct(r.slopePct, 1)}</b>`, cls: "num" },
    { html: r.oneOff ? `<span class="delta-chip warn">لمرة واحدة</span>`
          : r.recurring ? `<span class="delta-chip neutral">متكرر</span>`
          : `<span class="delta-chip warn">متقطّع</span>`, cls: "num" },
    { html: `<span dir="ltr">${CH.sparkline({ data: r.series, color: CH.C.burgundy })}</span>`, cls: "num" }
  ]}));
  rows.push({ cls: "row-total", cells: [
    { html: "<b>الإجمالي</b>" },
    { html: num(M.total), cls: "num strong" },
    { html: "100.0%", cls: "num" },
    { html: pctS(M.pctOfRevenue, 2), cls: "num" },
    { html: num(Math.round(M.total / (M.months.length || 1))), cls: "num" },
    { html: "—", cls: "num" }, { html: "—", cls: "num" }, { html: "—", cls: "num" },
    { html: "—", cls: "num" }, { html: "", cls: "num" }
  ]});

  el.innerHTML = `
  ${!hasY ? `<div class="verdict-banner crit" style="margin-bottom:18px"><strong>تنبيه بيانات:</strong> ${E.costPendingText(year)} الأرقام أدناه لسنة 2025.</div>` : ""}
  ${UI.sectionHead(cfg.num, cfg.kicker, cfg.title, cfg.sub + " · " + useYear)}
  <div class="kpi-row">
    ${UI.kpiPrimary({ label: "الإجمالي", value: num(M.total), note: `${useYear} · ${M.months.length} أشهر`,
      delta: pctS(M.pctOfRevenue, 2) + " من الإيراد", deltaTone: "neutral" })}
    ${UI.kpiPrimary({ label: "عدد البنود", value: String(M.rows.length), note: "بنود ذات حركة",
      delta: `أكبر بند ${pctS(top.share, 1)}`, deltaTone: "neutral" })}
    ${UI.kpiPrimary({ label: "أكبر 3 بنود", value: pctS(M.cr3, 1), note: "من إجمالي المصروف",
      delta: M.cr3 > 60 ? "تركّز مرتفع" : "توزيع معقول", deltaTone: M.cr3 > 60 ? "neg" : "pos" })}
    ${UI.kpiPrimary({ label: "بنود متكررة", value: num(M.recurringTotal), note: "تظهر كل شهر",
      delta: M.total ? pctS(M.recurringTotal / M.total * 100, 0) + " من المصروف" : "—", deltaTone: "neutral" })}
  </div>

  ${UI.panel({ title: `${cfg.title} — تفصيل البنود`, badge: `<span class="badge">${useYear}</span>`,
    body: UI.table({ heads: ["البند", "القيمة", "% من المصروف", "% من الإيراد", "متوسط الشهر", "أشهر نشطة", "التذبذب", "الاتجاه", "النمط", "المسار"],
      rightAlign: true, rows }),
    foot: `أكبر بند <b>${top.ar}</b> بـ${num(top.value)} ريال (${pctS(top.share, 1)} من المصروف · ${pctS(top.ofRevenue, 2)} من الإيراد). أكبر 3 بنود تمثّل ${pctS(M.cr3, 1)} وأكبر 5 تمثّل ${pctS(M.cr5, 1)}.` })}

  ${UI.panel({ title: "الاتجاه الشهري — القيمة ونسبتها من الإيراد",
    body: CH.comboChart({ labels,
      columns: [{ name: cfg.title, color: CH.C.burgundy, data: monthly.map(m => m.value) }],
      line: { name: "% من الإيراد", color: CH.C.gold, data: monthly.map(m => m.ratio) },
      yFmtC: v => E.fmt(v), yFmtL: v => E.fmtPct(v, { digits: 1 }) }),
    foot: `المصروف يمثّل ${pctS(M.pctOfRevenue, 2)} من إيراد الفترة.` })}

  ${UI.panel({ title: "الوزن النسبي للبنود",
    body: (() => {
      const PALW = [CH.C.gold, CH.C.burgundy, CH.C.emerald, CH.C.blue, CH.C.navy2, CH.C.muted,
                    "#C9A96A", "#8FB8A0", "#B08D96", "#7C8DA8"];
      const segs = M.rows.slice(0, 10).map((r, i) => ({
        label: r.ar, name: r.ar, value: r.value, color: PALW[i % PALW.length] }));
      const donut = CH.donutChart({ size: 260, segments: segs, fmt: v => E.fmt(v) });
      const bars = CH.hbarChart({ items: segs.map(g => ({
        label: g.label, value: g.value, pct: M.total ? g.value / M.total * 100 : 0, color: g.color })),
        fmt: v => E.fmt(v), left: 190 });
      return `<div class="chart-split"><div class="cs-a" dir="ltr">${donut}</div><div class="cs-b">${bars}</div></div>`;
    })(),
    foot: `أكبر 10 بنود بالقيمة — تمثّل ${pctS(M.rows.slice(0, 10).reduce((a, r) => a + r.value, 0) / (M.total || 1) * 100, 1)} من إجمالي المصروف.` })}

  ${UI.panel({ title: "الجدول الشهري الكامل — بند × شهر",
    body: UI.table({ heads: ["البند", ...monthly.map(m => m.ar), "الإجمالي"], rightAlign: true,
      rows: M.rows.map(r => ({ cells: [
        { html: `<b>${r.ar}</b>` },
        ...r.series.map(v => ({ html: v === 0 ? "—" : num(v), cls: v === 0 ? "num dim" : "num" })),
        { html: `<b>${num(r.value)}</b>`, cls: "num ytd" }
      ]})).concat([{ cls: "row-total", cells: [
        { html: "<b>الإجمالي</b>" },
        ...monthly.map(m => ({ html: num(m.value), cls: "num strong" })),
        { html: `<b>${num(M.total)}</b>`, cls: "num ytd" }
      ]}]) }) })}

  ${UI.insight((() => {
    const oneOffs = M.rows.filter(r => r.oneOff);
    const rising = M.rows.filter(r => r.slopePct !== null && r.slopePct > 5 && r.value > M.total * 0.02);
    let t = `بلغ ${cfg.title} ${num(M.total)} ريال خلال ${M.months.length} أشهر من ${useYear}، أي ${pctS(M.pctOfRevenue, 2)} من الإيراد. `;
    t += `يتصدّره <b>${top.ar}</b> بـ${num(top.value)} ريال (${pctS(top.share, 1)}). `;
    if (M.cr3 > 60) t += `التركّز مرتفع: أكبر 3 بنود وحدها ${pctS(M.cr3, 1)} من المصروف، وأي ضبط للتكلفة يبدأ منها. `;
    if (rising.length) t += `بنود تتصاعد شهرياً: ${rising.slice(0, 3).map(r => `${r.ar} (${sgnPct(r.slopePct, 1)}/شهر)`).join("، ")}. `;
    if (oneOffs.length) t += `وبنود ظهرت لمرة واحدة: ${oneOffs.slice(0, 3).map(r => `${r.ar} ${num(r.value)}`).join("، ")} وتُستبعد عند بناء المعدّل المتكرر. `;
    t += `البنود المتكررة تشكّل ${M.total ? pctS(M.recurringTotal / M.total * 100, 0) : "—"} من المصروف، وهي الأساس الثابت للتكلفة.`;
    return t;
  })())}`;
}

PAGES["break-even"] = {

  render(el, ST) {
    const scope = ST.scope;
    const be = Object.assign({}, FIN.breakEven, E.beLive(scope) || {});
    /* سنة التكاليف: 2026 لو توفرت تكاليفها، وإلا 2025 (المصدر الوحيد الحالي لبيانات التكلفة) */
    const costYear = E.totals(2026, scope).cogs > 0 ? 2026 : 2025;
    const t26 = E.totals(costYear, scope);
    const costYearNote = costYear === 2025 ? " · التكاليف على أساس 2025 (تكاليف 2026 لم تُستلم بعد)" : "";
    /* الرسم: محور س = المبيعات الشهرية، محور ص = القيمة (ريال).
       خط التكلفة = المصروفات الشهرية الجارية (متوسط الفترة) + التكلفة المتغيرة (نسبة COGS)
       → التقاطع الحقيقي للخطوط هو التعادل المحسوب من البيانات الفعلية.
       رقم الشركة المعتمد (FIN.breakEven.requiredSales) يظهر كعلامة مرجعية. */
    const avgMonthlyTotalExpenses = Math.round(t26.totalExpenses / t26.monthCount);
    const varRate = t26.cogsPct / 100;
    /* الهامش الدقيق من الأرقام الفعلية (بدل المطبوع المقرب لرقمين عشريين) */
    const gmExact = t26.grossProfit / t26.revenue * 100;

    const beCand = [beComputed, be.actualAvgSales, be.requiredSales, bwRev.best.v, Math.round(t26.avgRevenue)]
      .filter(v => typeof v === "number" && isFinite(v) && v > 0);
    const maxX = beCand.length ? CH.niceMax(Math.max.apply(null, beCand) * 1.25) : 0;
    const maxY = maxX ? CH.niceMax(Math.max(maxX, avgMonthlyTotalExpenses + maxX * (varRate || 0)) * 1.05) : 0;

    const costPts = [{ x: 0, y: avgMonthlyTotalExpenses }, { x: maxX, y: Math.round(avgMonthlyTotalExpenses + maxX * (varRate || 0)) }];
    const fixedPts = [{ x: 0, y: be.fixedMonthly.total }, { x: maxX, y: be.fixedMonthly.total }];
    const beHasData = maxX > 0 && isFinite(beComputed) && beComputed > 0;
    el.innerHTML = `
    ${costGuardBanner(ST.scope)}
    ${UI.sectionHead("22", "FINANCIAL ANALYSIS · التحليل المالي", "نقطة التعادل", "مبيعات التعادل المعتمدة في تقرير الشركة: " + E.fmtS("revenue", be.requiredSales) + " ريال/شهر" + costYearNote)}
    <div class="kpi-row">

  }

  /* ---------- شاشة الدخول (الغلاف + كلمة المرور) ---------- */
  let coverCount = 0;
  function renderCover() {
    pageEl.innerHTML = `
    <div class="cover q-pattern" style="background-image:url('${COVER_IMG}')">
      <div class="cover-inner cover-lock-layout">
        <div class="cover-brand-lg">
          <div class="logo-drop" id="logo-drop">
            ${LOGO}
            ${WORD}
          </div>
          <div class="cb-en-lg">SCENT OF NATURE TRADING L.L.C SAUDI ARABIA</div>
          <div class="cb-sub-lg">الرياض · السعودية — RIYADH · SAUDI ARABIA</div>
        </div>
        <div class="pw-card" id="pw-card">
          <div class="pw-lock-icon"><svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5z"/></svg></div>
          <div class="pw-label">هذا التقرير خاص بالإدارة — أدخل كلمة المرور للدخول</div>
          <input type="password" id="pw-input" inputmode="numeric" placeholder="••••" autocomplete="off">
          <button class="btn-enter pw-btn" id="pw-btn">دخول التقرير المالي</button>
          <div id="pw-error" class="pw-error hidden">كلمة المرور غير صحيحة</div>
        </div>
        <div class="pw-credits" dir="ltr">Powered by <b>Smart Financial Solutions</b> <span class="sfs-tel">0501297424</span></div>
      </div>
    </div>`;
    /* اهتزاز الشاشة لحظة الارتكاز (بدون صوت تلقائي) */
    setTimeout(() => {
      const cv = document.querySelector(".cover");
      if (cv) { cv.classList.add("landing-shake"); setTimeout(() => cv.classList.remove("landing-shake"), 500); }
    }, 700);
  }

  function initLock() {
    const submit = () => {
      const inp = $("#pw-input");
      const v = inp ? inp.value : "";
      if (checkPassword(v)) {
        unlockedMem = true;
        store.set("sonat-auth", "1");
        go("exec-overview");
      } else {
        /* رسالة الخطأ تظهر فقط عند إدخال خاطئ فعلي — ليست تلقائية */
        if (v.trim() !== "") {
          const err = $("#pw-error");
          if (err) err.classList.remove("hidden");
        }
        const card = $("#pw-card");
        if (card) { card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
        if (inp) { inp.value = ""; inp.focus(); }
      }
    };
    document.addEventListener("click", e => { if (e.target.closest("#pw-btn")) submit(); });
    document.addEventListener("keydown", e => { if (e.key === "Enter" && ST.page === "cover") submit(); });
  }

  /* ---------- الشريط الجانبي: درج يفتح ويغلق ---------- */
  function initSidebar() {
    const sidebar = $("#sidebar"), backdrop = $("#sidebar-backdrop"), fab = $("#fab-menu");
    const open = () => {
      sidebar.classList.add("open");
      document.body.classList.add("sidebar-open");
      backdrop.classList.add("show");
    };
    const close = () => {
      sidebar.classList.remove("open");
      document.body.classList.remove("sidebar-open");
      backdrop.classList.remove("show");
    };
    if (fab) fab.addEventListener("click", open);
    if (backdrop) backdrop.addEventListener("click", close);
    document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  }
  function closeSidebar() {
    const sidebar = $("#sidebar"), backdrop = $("#sidebar-backdrop");
    if (sidebar) sidebar.classList.remove("open");
    document.body.classList.remove("sidebar-open");
    if (backdrop) backdrop.classList.remove("show");
  }

  /* ---------- التوجيه الافتتاحي ---------- */
  function initRouter() {
    let h = "";
    try { h = location.hash.replace(/^#\/?/, ""); } catch (e) {}
    ST.page = (h && PAGES[h]) ? h : ST.page;
    if (ST.page !== "cover" && !isUnlocked()) ST.page = "cover";
    window.addEventListener("hashchange", () => {
      let p = "";
      try { p = location.hash.replace(/^#\/?/, ""); } catch (e) {}
      if (p && PAGES[p]) { ST.page = p; render(); }
    });
  }

  function init() {
    buildNav();
    initLock();
    initSidebar();
    initRouter();
    render();
  }

  return { go, ST, init, checkPassword };
})();

/* ============================================================================
   ANIM — أنيميشن الدخول + عدّاد الأرقام (Count-up)
   ========================================================================== */
const ANIM = (function () {
  const raf = window.requestAnimationFrame || (cb => setTimeout(() => cb(Date.now()), 16));

  /* العناصر التي يتحرك عدّاد أرقامها */
  const COUNT_SEL = ".cnt-num, .kpi-value, .kpi2-value, .stage-value, .wf-stat, .eff-value, .ratio-result, .sc-metric, .tbl .num.strong, .tbl .ytd";

  /* العناصر التي تدخل بحركة متتابعة */
  const STAGGER_SEL = ".sec-head, .hero-copy, .hero-card, .kpi-primary, .kpi-secondary, .panel, .stage, .ratio-card, .eff-card, .signal-card, .finding, .opp-card, .risk-card, .rec-group, .insight, .focus";

  function parseNum(txt) {
    const m = (txt || "").trim().match(/^([^0-9-]*?)(-?[\d,]+(?:\.\d+)?)(.*)$/);
    if (!m) return null;
    const numStr = m[2].replace(/,/g, "");
    const v = parseFloat(numStr);
    if (isNaN(v)) return null;
    return { prefix: m[1], v, dec: (numStr.split(".")[1] || "").length, suffix: m[3] };
  }
  function fmtNum(v, dec) {
    const neg = v < 0;
    return (neg ? "-" : "") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  }

  function countUp(el, p) {
    const dur = 1000;
    let t0 = null;
    const step = ts => {
      if (t0 === null) t0 = ts;
      const t = Math.min((ts - t0) / dur, 1);
      const e = 1 - Math.pow(1 - t, 3);   /* easeOutCubic */
      el.textContent = p.prefix + fmtNum(p.v * e, p.dec) + p.suffix;
      if (t < 1) raf(step);
      else el.textContent = p.prefix + fmtNum(p.v, p.dec) + p.suffix;
    };
    raf(step);
  }

  function run(root) {
    if (!root || !root.querySelectorAll) return;
    /* 1) دخول متتابع */
    let i = 0;
    root.querySelectorAll(STAGGER_SEL).forEach(el => {
      el.classList.add("anim");
      el.style.animationDelay = Math.min(i * 55, 650) + "ms";
      i++;
    });
    /* 2) عدّاد الأرقام */
    root.querySelectorAll(COUNT_SEL).forEach(el => {
      const p = parseNum(el.textContent);
      if (p) countUp(el, p);
    });
  }

  return { run };
})();

    App.init();
  }
})();
